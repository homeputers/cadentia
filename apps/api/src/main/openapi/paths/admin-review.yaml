"/admin/song-imports/manual":
  post:
    tags:
    - AdminReview
    operationId: createAdminManualSongImport
    security:
    - bearerAuth: []
    x-required-roles:
    - CATALOG_EDITOR
    - ADMIN
    summary: Stage a manually entered song import for admin review
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/admin-review.yaml#/AdminManualSongImportRequest"
    responses:
      '201':
        description: Manual import batch and staged candidate were created.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/admin-review.yaml#/AdminSongImportResponse"
      '400':
        "$ref": "../components/shared/responses.yaml#/ValidationError"
      '401':
        "$ref": "../components/shared/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/shared/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/shared/responses.yaml#/ValidationError"
"/admin/song-imports/csv":
  post:
    tags:
    - AdminReview
    operationId: createAdminCsvSongImport
    security:
    - bearerAuth: []
    x-required-roles:
    - CATALOG_EDITOR
    - ADMIN
    summary: Stage song imports from an uploaded CSV file for admin review
    requestBody:
      required: true
      content:
