"/admin/import-candidates":
  get:
    tags:
    - AdminReview
    operationId: listAdminImportCandidates
    security:
    - bearerAuth: []
    x-required-roles:
    - CATALOG_EDITOR
    - ADMIN
    summary: List import candidates for admin triage queue
    parameters:
    - in: query
      name: batchId
      required: true
      schema:
        type: string
        format: uuid
    - in: query
      name: status
      schema:
        "$ref": "../components/schemas/admin-review.yaml#/ImportCandidateStatus"
    responses:
      '200':
        description: Candidate queue page.
        content:
          application/json:
            schema:
              type: array
              items:
                "$ref": "../components/schemas/admin-review.yaml#/AdminImportCandidateQueueItem"
"/admin/import-candidates/{candidateId}":
  get:
    tags:
    - AdminReview
    operationId: getAdminImportCandidateDetail
    security:
    - bearerAuth: []
    x-required-roles:
    - CATALOG_EDITOR
    - ADMIN
    summary: Fetch admin candidate detail with parser evidence
    parameters:
    - in: path
      name: candidateId
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Candidate detail.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/admin-review.yaml#/AdminImportCandidateDetailResponse"
      '404':
        description: Candidate not found.
"/admin/import-candidates/{candidateId}/duplicates":
  get:
    tags:
    - AdminReview
    operationId: getAdminImportCandidateDuplicates
    security:
    - bearerAuth: []
    x-required-roles:
    - CATALOG_EDITOR
    - ADMIN
    summary: Fetch ranked duplicate matches for a candidate
    parameters:
    - in: path
      name: candidateId
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Duplicate matches.
        content:
          application/json:
            schema:
              type: array
              items:
                "$ref": "../components/schemas/admin-review.yaml#/AdminDuplicateMatch"
"/admin/import-candidates/{candidateId}/audit-history":
  get:
    tags:
    - AdminReview
    operationId: getAdminImportCandidateAuditHistory
    security:
    - bearerAuth: []
    x-required-roles:
    - CATALOG_EDITOR
