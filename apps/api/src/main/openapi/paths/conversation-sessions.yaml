"/conversation-sessions/{sessionId}/recover":
  post:
    tags:
    - Setlists
    operationId: recoverConversationSession
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - CATALOG_EDITOR
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: Recover from an expired session
    parameters:
    - in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Recovery options and a restarted or resumed state.
        content:
          application/json:
