"/setlists/proposals/natural-language":
  post:
    tags:
    - Setlists
    operationId: generateSetlistProposalFromNaturalLanguage
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - CATALOG_EDITOR
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: Generate a setlist proposal from natural-language text
    description: Accepts raw user text, invokes the LLM intent boundary, validates
      the resulting contract payload, applies backend defaults, and invokes recommendation
      only for valid GENERATE_SETLIST intents. Recommendations are sourced from approved
      and active catalog content only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/setlists.yaml#/NaturalLanguageSetlistRequest"
    responses:
      '202':
        description: Setlist proposal accepted, clarification requested, or safely
          rejected.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/setlists.yaml#/SetlistProposalResponse"
      '400':
        description: Request validation failed.
"/setlists/proposals":
  post:
    tags:
    - Setlists
    operationId: generateSetlistProposal
    summary: Generate a setlist proposal from structured intent slots
    description: Accepts structured slots produced by the intent parser. Song selection
      remains backend-only and must use approved and active catalog data only. When
      an explanation payload is included, every explanation fact is generated by the
      deterministic Recommendation Engine from scoring, policy, and catalog evidence;
      clients must not treat LLM prose or client-provided rationale as explanation
      source-of-truth.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/setlists.yaml#/GenerateSetlistRequest"
    responses:
      '202':
        description: Setlist proposal accepted or safely deferred until catalog support
          is available.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/setlists.yaml#/SetlistProposalResponse"
      '400':
        description: Request validation failed.
"/setlists":
  post:
    tags:
    - Setlists
    operationId: createSetlistBaselineVersion
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - CATALOG_EDITOR
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: Persist a generated setlist baseline as version 1
    description: Stores the deterministic recommendation output and immutable generation
      context. The resulting resource is identified by a logical setlist_id and immutable
      version_id.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/setlists.yaml#/CreateSetlistBaselineRequest"
    responses:
      '201':
        description: Baseline version created.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/setlists.yaml#/SetlistVersionEnvelope"
      '400':
        description: Request validation failed.
"/setlists/{setlistId}/edits":
  post:
    tags:
    - Setlists
    operationId: commitSetlistEdits
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - CATALOG_EDITOR
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: Commit auditable edit operations as a new immutable version
    parameters:
    - in: path
      name: setlistId
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/setlists.yaml#/CommitSetlistEditsRequest"
    responses:
      '201':
        description: Edit operations committed and a new immutable version created.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/setlists.yaml#/SetlistVersionEnvelope"
      '404':
        description: Setlist or base version does not exist.
      '409':
        description: Base version is locked or is not the latest permitted editable
          ancestor.
"/setlists/{setlistId}/versions":
  get:
    tags:
    - Setlists
    operationId: listSetlistVersions
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - CATALOG_EDITOR
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: List immutable versions for a setlist lineage
    description: 'User-facing results include only songs and arrangements that are
      approved and active at read time.

      '
    parameters:
    - in: path
      name: setlistId
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Ordered version lineage metadata.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/setlists.yaml#/SetlistVersionListResponse"
      '404':
        description: Setlist not found.
"/setlists/{setlistId}/versions/{versionId}":
  get:
    tags:
    - Setlists
    operationId: getSetlistVersion
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - CATALOG_EDITOR
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: Retrieve a specific immutable setlist version snapshot
    description: 'User-facing results include only songs and arrangements that are
      approved and active at read time.

      '
    parameters:
    - in: path
      name: setlistId
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: versionId
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Immutable snapshot and provenance details.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/setlists.yaml#/SetlistVersionEnvelope"
      '404':
        description: Setlist or version not found.
"/setlists/{setlistId}/versions/{fromVersionId}/diff/{toVersionId}":
  get:
    tags:
    - Setlists
    operationId: diffSetlistVersions
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - CATALOG_EDITOR
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: Compare two immutable versions in the same setlist lineage
    parameters:
    - in: path
      name: setlistId
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: fromVersionId
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: toVersionId
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Deterministic structural and attribute diff.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/setlists.yaml#/SetlistVersionDiffResponse"
      '404':
        description: Setlist or requested versions not found.
