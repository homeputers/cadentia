"/service-plans/{servicePlanId}/arrangement-overrides":
  get:
    tags:
    - RehearsalWorkflow
    operationId: listArrangementOverrides
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ASSIGNED_MUSICIAN
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - REPORTING_VIEWER
    summary: List service-scoped arrangement overrides
    description: Rehearsal overrides are service-scoped effective values only and
      never update approved catalog arrangements.
    parameters:
    - "$ref": "../cadentia-api.components.yaml#/parameters/ServicePlanId"
    responses:
      '200':
        description: Service-scoped arrangement overrides.
        content:
          application/json:
            schema:
              type: array
              items:
                "$ref": "../cadentia-api.components.yaml#/schemas/ArrangementOverrideResponse"
  post:
    tags:
    - RehearsalWorkflow
    operationId: createArrangementOverride
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Create a service-scoped arrangement override
    description: Creates effective arrangement values for this service only; approved
      catalog arrangements are not mutated by this workflow path.
    parameters:
    - "$ref": "../cadentia-api.components.yaml#/parameters/ServicePlanId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../cadentia-api.components.yaml#/schemas/CreateArrangementOverrideRequest"
    responses:
      '201':
        description: Override created.
        content:
          application/json:
            schema:
              "$ref": "../cadentia-api.components.yaml#/schemas/ArrangementOverrideResponse"
"/service-plans/{servicePlanId}/arrangement-overrides/{arrangementOverrideId}":
  patch:
    tags:
    - RehearsalWorkflow
    operationId: updateArrangementOverride
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Update a service-scoped arrangement override
    description: Updates service-scoped effective values only; approved catalog arrangements
      are not mutated.
    parameters:
    - "$ref": "../cadentia-api.components.yaml#/parameters/ServicePlanId"
    - "$ref": "../cadentia-api.components.yaml#/parameters/ArrangementOverrideId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../cadentia-api.components.yaml#/schemas/UpdateArrangementOverrideRequest"
    responses:
      '200':
        description: Override updated.
        content:
          application/json:
            schema:
              "$ref": "../cadentia-api.components.yaml#/schemas/ArrangementOverrideResponse"
      '409':
        "$ref": "../cadentia-api.components.yaml#/responses/WorkflowVersionConflict"
  delete:
    tags:
    - RehearsalWorkflow
    operationId: archiveArrangementOverride
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Archive a service-scoped arrangement override
    parameters:
    - "$ref": "../cadentia-api.components.yaml#/parameters/ServicePlanId"
    - "$ref": "../cadentia-api.components.yaml#/parameters/ArrangementOverrideId"
    responses:
      '204':
        description: Override archived.
