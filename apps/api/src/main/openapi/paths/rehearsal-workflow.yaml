"/service-plans/{servicePlanId}/effective-arrangements/{arrangementId}":
  get:
    tags:
    - RehearsalWorkflow
    operationId: renderEffectiveArrangement
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ASSIGNED_MUSICIAN
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - REPORTING_VIEWER
    summary: Render a service-effective arrangement
    description: Resolves an approved canonical arrangement with service-scoped rehearsal overrides for service planning, charts, and rehearsal rendering only. Catalog metadata and recommendation read models are not updated.
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    - in: path
      name: arrangementId
      required: true
      schema:
        type: string
        format: uuid
    - in: query
      name: servicePlanBlockId
      required: false
      schema:
        type: string
        format: uuid
    - in: query
      name: setlistVersionItemId
      required: false
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Effective arrangement values with source and override provenance.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/rehearsal-workflow.yaml#/EffectiveArrangementResponse"
"/service-plans/{servicePlanId}/arrangement-overrides":
  get:
    tags:
    - RehearsalWorkflow
    operationId: listArrangementOverrides
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ASSIGNED_MUSICIAN
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - REPORTING_VIEWER
    summary: List service-scoped arrangement overrides
    description: Rehearsal overrides are service-scoped effective values only and
      never update approved catalog arrangements.
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    responses:
      '200':
        description: Service-scoped arrangement overrides.
        content:
          application/json:
            schema:
              type: array
              items:
                "$ref": "../components/schemas/rehearsal-workflow.yaml#/ArrangementOverrideResponse"
  post:
    tags:
    - RehearsalWorkflow
    operationId: createArrangementOverride
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Create a service-scoped arrangement override
    description: Creates effective arrangement values for this service only; approved
      catalog arrangements are not mutated by this workflow path.
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/rehearsal-workflow.yaml#/CreateArrangementOverrideRequest"
    responses:
      '201':
        description: Override created.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/rehearsal-workflow.yaml#/ArrangementOverrideResponse"
"/service-plans/{servicePlanId}/arrangement-overrides/{arrangementOverrideId}":
  patch:
    tags:
    - RehearsalWorkflow
    operationId: updateArrangementOverride
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Update a service-scoped arrangement override
    description: Updates service-scoped effective values only; approved catalog arrangements
      are not mutated.
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    - "$ref": "../components/shared/parameters.yaml#/ArrangementOverrideId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/rehearsal-workflow.yaml#/UpdateArrangementOverrideRequest"
    responses:
      '200':
        description: Override updated.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/rehearsal-workflow.yaml#/ArrangementOverrideResponse"
      '409':
        "$ref": "../components/shared/responses.yaml#/WorkflowVersionConflict"
  delete:
    tags:
    - RehearsalWorkflow
    operationId: archiveArrangementOverride
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Archive a service-scoped arrangement override
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    - "$ref": "../components/shared/parameters.yaml#/ArrangementOverrideId"
    responses:
      '204':
        description: Override archived.
