"/service-plans/{servicePlanId}/rehearsal-sessions":
  get:
    tags:
    - RehearsalWorkflow
    operationId: listRehearsalSessions
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ASSIGNED_MUSICIAN
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - REPORTING_VIEWER
    summary: List service-scoped rehearsal sessions
    parameters:
    - "$ref": "../cadentia-api.components.yaml#/parameters/ServicePlanId"
    responses:
      '200':
        description: Rehearsal sessions visible to the caller.
        content:
          application/json:
            schema:
              type: array
              items:
                "$ref": "../cadentia-api.components.yaml#/schemas/RehearsalSessionResponse"
  post:
    tags:
    - RehearsalWorkflow
    operationId: createRehearsalSession
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Create a rehearsal session for a service plan
    parameters:
    - "$ref": "../cadentia-api.components.yaml#/parameters/ServicePlanId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../cadentia-api.components.yaml#/schemas/CreateRehearsalSessionRequest"
    responses:
      '201':
        description: Rehearsal session created.
        content:
          application/json:
            schema:
              "$ref": "../cadentia-api.components.yaml#/schemas/RehearsalSessionResponse"
      '400':
        "$ref": "../cadentia-api.components.yaml#/responses/InvalidWorkflowPayload"
"/service-plans/{servicePlanId}/rehearsal-sessions/{rehearsalSessionId}":
  patch:
    tags:
    - RehearsalWorkflow
    operationId: updateRehearsalSession
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Update mutable rehearsal session metadata
    parameters:
    - "$ref": "../cadentia-api.components.yaml#/parameters/ServicePlanId"
    - "$ref": "../cadentia-api.components.yaml#/parameters/RehearsalSessionId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../cadentia-api.components.yaml#/schemas/UpdateRehearsalSessionRequest"
    responses:
      '200':
        description: Rehearsal session updated.
        content:
          application/json:
            schema:
              "$ref": "../cadentia-api.components.yaml#/schemas/RehearsalSessionResponse"
      '409':
        "$ref": "../cadentia-api.components.yaml#/responses/WorkflowVersionConflict"
  delete:
    tags:
    - RehearsalWorkflow
    operationId: archiveRehearsalSession
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    summary: Archive a rehearsal session without deleting audit history
    parameters:
    - "$ref": "../cadentia-api.components.yaml#/parameters/ServicePlanId"
    - "$ref": "../cadentia-api.components.yaml#/parameters/RehearsalSessionId"
    responses:
      '200':
        description: Rehearsal session archived.
        content:
          application/json:
            schema:
              "$ref": "../cadentia-api.components.yaml#/schemas/RehearsalSessionResponse"
