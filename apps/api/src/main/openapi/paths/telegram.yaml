      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/telegram.yaml#/TelegramChannelSettingsRequest
    responses:
      '200':
        description: Updated channel settings.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/telegram.yaml#/TelegramChannelSettingsResponse
      '400':
        description: Invalid channel settings request.
      '401':
        description: Authentication is required.
      '403':
        description: Caller is not authorized for the requested church instance.
      '404':
        description: Channel was not found for this church instance.
