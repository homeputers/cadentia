"/telegram/webhooks/{botId}":
  post:
    tags:
    - Telegram
    operationId: acceptTelegramWebhookUpdate
    summary: Accept a Telegram webhook update for asynchronous processing
    description: Validates the Telegram secret-token header and accepts retry-safe, idempotent processing without synchronously completing setlist generation.
    parameters:
    - in: path
      name: botId
      required: true
      schema:
        type: string
    - in: header
      name: X-Telegram-Bot-Api-Secret-Token
      required: true
      schema:
        type: string
        minLength: 1
      description: Telegram webhook secret-token verification header. Never echoed in responses or logs.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/telegram.yaml#/TelegramUpdate
    responses:
      '202':
        description: Update accepted or duplicate-accepted for asynchronous processing.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/telegram.yaml#/TelegramWebhookAcceptedResponse
      '400':
        description: Telegram update payload failed validation.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/telegram.yaml#/TelegramProblemResponse
      '401':
        description: Missing Telegram secret-token header.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/telegram.yaml#/TelegramProblemResponse
      '403':
        description: Telegram secret-token header did not match configured bot secret.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/telegram.yaml#/TelegramProblemResponse
      '500':
        description: Retry-safe server failure. Telegram may retry this update.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/telegram.yaml#/TelegramProblemResponse
"/admin/telegram/bots/{botId}/status":
  get:
    tags:
    - Telegram
    operationId: getTelegramBotStatus
    security:
    - bearerAuth: []
    x-required-roles:
    - ADMIN
    summary: Read Telegram bot health and webhook status for a church instance
    parameters:
    - in: path
      name: botId
      required: true
      schema:
        type: string
    - in: query
      name: churchInstanceId
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Redacted bot status scoped to the requested church instance.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/telegram.yaml#/TelegramBotStatusResponse
      '401':
        description: Authentication is required.
      '403':
        description: Caller is not authorized for the requested church instance.
      '404':
        description: Bot configuration was not found for this church instance.
"/admin/telegram/channels/{channelId}/settings":
