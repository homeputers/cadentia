"/telegram/sessions/{sessionId}:cancel":
  post:
    tags:
    - Telegram
    operationId: cancelTelegramSession
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - ADMIN
    summary: Cancel an active Telegram channel session
    parameters:
    - in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
    - in: query
      name: churchInstanceId
      required: true
      schema:
        type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/telegram.yaml#/TelegramSessionCancellationRequest
    responses:
      '200':
        description: Cancelled Telegram session status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/telegram.yaml#/TelegramSessionStatusResponse
      '401':
        description: Authentication is required.
      '403':
        description: Caller is not authorized for the requested church instance.
      '404':
        description: Session was not found for this church instance.
      '409':
        description: Session cannot be cancelled from its current state.

