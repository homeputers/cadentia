"/team-assignments/musicians/{musicianId}/upcoming":
  get:
    tags:
    - TeamAssignments
    operationId: listUpcomingTeamAssignmentsForMusician
    security:
    - bearerAuth: []
    x-required-roles:
    - ASSIGNED_MUSICIAN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ADMIN
    summary: List upcoming service assignments for a musician
    parameters:
    - in: path
      name: musicianId
      required: true
      schema:
        type: string
        format: uuid
    - in: query
      name: fromInclusive
      required: true
      schema:
        type: string
        format: date-time
    responses:
      '200':
        description: Upcoming service assignments.
        content:
          application/json:
            schema:
              type: array
              items:
                "$ref": "../components/schemas/team-assignments.yaml#/TeamServiceAssignmentResponse"
"/team-assignments/musicians":
  get:
    tags:
    - TeamAssignments
    operationId: listTeamMusicians
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - REPORTING_VIEWER
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: List instance musicians for roster and assignment pickers
    description: Returns privacy-aware musician records. Contact, vocal-range, and
      serving-preference fields are omitted unless the caller role is permitted to
      read them.
    responses:
      '200':
        description: Instance musician directory.
        content:
          application/json:
            schema:
              type: array
              items:
                "$ref": "../components/schemas/team-assignments.yaml#/TeamMusicianResponse"
  post:
    tags:
    - TeamAssignments
    operationId: createTeamMusician
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - ADMIN
    summary: Create an instance-scoped musician
    description: Creates a musician with optional contact/account links, vocal range,
      and serving preference. Writes privileged personnel audit records.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/team-assignments.yaml#/CreateTeamMusicianRequest"
    responses:
      '201':
        description: Musician created.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/team-assignments.yaml#/TeamMusicianResponse"
"/team-assignments/musicians/{musicianId}":
  get:
    tags:
    - TeamAssignments
    operationId: getTeamMusician
    security:
    - bearerAuth: []
    x-required-roles:
    - ASSIGNED_MUSICIAN
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - REPORTING_VIEWER
    - DOCTRINAL_REVIEWER
    - MUSICAL_REVIEWER
    - ADMIN
    summary: Get a privacy-aware musician profile
    description: Assigned musicians may read their own profile. Existence is not
      leaked to unauthorized callers.
    parameters:
    - in: path
      name: musicianId
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Musician profile.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/team-assignments.yaml#/TeamMusicianResponse"
      '404':
        description: Musician not found.
