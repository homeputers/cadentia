"/team-assignments/services/{servicePlanId}":
  post:
    tags:
    - TeamAssignments
    operationId: createServiceTeamAssignment
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ADMIN
    summary: Create a service team assignment
    description: 'Creates a structured assignment using controlled role, instrument,
      vocal part, and assignment-status values. Unavailable musicians require an explicit
      override.

      '
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/team-assignments.yaml#/TeamServiceAssignmentRequest"
    responses:
      '201':
        description: Service assignment created.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/team-assignments.yaml#/TeamServiceAssignmentResponse"
"/team-assignments/services/{servicePlanId}/assignments/{assignmentId}":
  put:
    tags:
    - TeamAssignments
    operationId: updateServiceTeamAssignment
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ADMIN
    summary: Update a service team assignment
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    - "$ref": "../components/shared/parameters.yaml#/AssignmentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/team-assignments.yaml#/TeamServiceAssignmentRequest"
    responses:
      '200':
        description: Service assignment updated.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/team-assignments.yaml#/TeamServiceAssignmentResponse"
  delete:
    tags:
    - TeamAssignments
    operationId: removeServiceTeamAssignment
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ADMIN
    summary: Remove a service team assignment without deleting history
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    - "$ref": "../components/shared/parameters.yaml#/AssignmentId"
    - in: query
      name: reasonCode
      schema:
        type: string
        default: remove_assignment
    - in: query
      name: reference
      schema:
        type: string
        nullable: true
    responses:
      '204':
        description: Assignment removed from the active roster.
"/team-assignments/services/{servicePlanId}/assignments/{assignmentId}/substitute":
  post:
    tags:
    - TeamAssignments
    operationId: substituteServiceTeamAssignment
    security:
    - bearerAuth: []
    x-required-roles:
    - WORSHIP_LEADER
    - TEAM_SCHEDULER
    - ADMIN
    summary: Add a substitute for a service assignment
    description: Creates a substitute row linked to the original assignment rather
      than overwriting history.
    parameters:
    - "$ref": "../components/shared/parameters.yaml#/ServicePlanId"
    - "$ref": "../components/shared/parameters.yaml#/AssignmentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/team-assignments.yaml#/TeamSubstituteAssignmentRequest"
    responses:
      '201':
        description: Substitute assignment created.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/team-assignments.yaml#/TeamServiceAssignmentResponse"
"/team-assignments/services/{servicePlanId}/reorder":
