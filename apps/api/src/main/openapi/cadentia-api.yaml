        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamSubstituteAssignmentRequest'
      responses:
        '201':
          description: Substitute assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamServiceAssignmentResponse'
  /team-assignments/services/{servicePlanId}/reorder:
    post:
      tags: [TeamAssignments]
      operationId: reorderServiceTeamAssignments
      security:
        - bearerAuth: []
      x-required-roles: [WORSHIP_LEADER, TEAM_SCHEDULER, ADMIN]
      summary: Reorder service team assignments
      parameters:
        - $ref: '#/components/parameters/ServicePlanId'
      requestBody:
