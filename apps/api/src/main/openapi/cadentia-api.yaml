openapi: 3.0.3
info:
  title: Cadentia API
  version: 0.1.0
  description: API-first contract for Cadentia setlist recommendation workflows.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Setlists
    description: Deterministic setlist proposal operations
  - name: AdminReview
    description: Admin import-governance review operations
  - name: FeedbackTuning
    description: Recommendation feedback ingestion, inspection, and reset operations
  - name: ServicePlans
    description: Service-plan composition, attachment, and publish operations
paths:
  /feedback/events:
    post:
      tags:
        - FeedbackTuning
      operationId: recordFeedbackEvent
      security:
        - bearerAuth: []
      x-required-roles: # recordFeedbackEvent
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Record explicit recommendation feedback for deterministic tuning
      description: >
        Persists explicit user feedback signals that influence ranking weights only.
        Feedback never changes eligibility gates such as approval, provenance, activity, or licensing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackEventRequest'
      responses:
        '201':
          description: Feedback event recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEventResponse'
    get:
      tags:
        - FeedbackTuning
      operationId: listFeedbackEvents
      security:
        - bearerAuth: []
      x-required-roles: # listFeedbackEvents
        - CATALOG_EDITOR
        - ADMIN
      summary: List feedback events for inspection and governance
      description: >
        Returns append-only feedback events by scope for audit and tuning analysis.
        Listing requires authenticated operational roles (for example TEAM_LEAD or ADMIN).
      parameters:
        - in: query
          name: scopeLayer
          schema:
            $ref: '#/components/schemas/FeedbackScopeLayer'
        - in: query
          name: scopeId
          schema:
            type: string
            format: uuid
        - in: query
          name: arrangementId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Feedback events matching filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackEventResponse'
  /feedback/scopes/{scopeLayer}/{scopeId}/state:
    get:
      tags:
        - FeedbackTuning
      operationId: getFeedbackScopeState
      security:
        - bearerAuth: []
      x-required-roles: # getFeedbackScopeState
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - ADMIN
      summary: Inspect deterministic feedback aggregate state for a scope
      description: >
        Returns aggregate counters and last-updated markers used by recommendation tuning.
        Scope resolution order is personal -> team -> policy/global fallback.
      parameters:
        - in: path
          name: scopeLayer
          required: true
          schema:
            $ref: '#/components/schemas/FeedbackScopeLayer'
        - in: path
          name: scopeId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aggregated feedback state for the requested scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackScopeStateResponse'
  /feedback/scopes/{scopeLayer}/{scopeId}/reset:
    post:
      tags:
        - FeedbackTuning
      operationId: resetFeedbackScopeState
      security:
        - bearerAuth: []
      x-required-roles: # resetFeedbackScopeState
        - ADMIN
      summary: Reset feedback state for a scope
      description: >
        Destructive governance operation that resets feedback influence state for a scope.
        This endpoint must be restricted to elevated roles (for example TEAM_LEAD or ADMIN).
      parameters:
        - in: path
          name: scopeLayer
          required: true
          schema:
            $ref: '#/components/schemas/FeedbackScopeLayer'
        - in: path
          name: scopeId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackResetRequest'
      responses:
        '200':
          description: Feedback scope reset was accepted and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResetResponse'
  /api/admin/import-candidates:
    get:
      tags:
        - AdminReview
      operationId: listAdminImportCandidates
      security:
        - bearerAuth: []
      x-required-roles: # listAdminImportCandidates
        - CATALOG_EDITOR
        - ADMIN
      summary: List import candidates for admin triage queue
      parameters:
        - in: query
          name: batchId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ImportCandidateStatus'
      responses:
        '200':
          description: Candidate queue page.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminImportCandidateQueueItem'
  /api/admin/import-candidates/{candidateId}:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateDetail
      security:
        - bearerAuth: []
      x-required-roles: # getAdminImportCandidateDetail
        - CATALOG_EDITOR
        - ADMIN
      summary: Fetch admin candidate detail with parser evidence
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Candidate detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportCandidateDetailResponse'
        '404':
          description: Candidate not found.
  /api/admin/import-candidates/{candidateId}/duplicates:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateDuplicates
      security:
        - bearerAuth: []
      x-required-roles: # getAdminImportCandidateDuplicates
        - CATALOG_EDITOR
        - ADMIN
      summary: Fetch ranked duplicate matches for a candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicate matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDuplicateMatch'

  /api/admin/import-candidates/{candidateId}/audit-history:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateAuditHistory
      security:
        - bearerAuth: []
      x-required-roles: # getAdminImportCandidateAuditHistory
        - CATALOG_EDITOR
        - ADMIN
      summary: Fetch append-only audit history for an import candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit history entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAuditHistoryItem'
  /api/admin/import-candidates/{candidateId}/moderation-flags:
    post:
      tags:
        - AdminReview
      operationId: openAdminModerationFlag
      security:
        - bearerAuth: []
      x-required-roles: # openAdminModerationFlag
        - CATALOG_EDITOR
        - ADMIN
      summary: Open a moderation flag for an import candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenModerationFlagRequest'
      responses:
        '200':
          description: Created moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/assign:
    post:
      tags:
        - AdminReview
      operationId: assignAdminModerationFlag
      security:
        - bearerAuth: []
      x-required-roles: # assignAdminModerationFlag
        - CATALOG_EDITOR
        - ADMIN
      summary: Assign a moderation flag to a reviewer
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/resolve:
    post:
      tags:
        - AdminReview
      operationId: resolveAdminModerationFlag
      security:
        - bearerAuth: []
      x-required-roles: # resolveAdminModerationFlag
        - CATALOG_EDITOR
        - ADMIN
      summary: Resolve a moderation flag
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/escalate:
    post:
      tags:
        - AdminReview
      operationId: escalateAdminModerationFlag
      security:
        - bearerAuth: []
      x-required-roles: # escalateAdminModerationFlag
        - CATALOG_EDITOR
        - ADMIN
      summary: Escalate a moderation flag
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'

  /api/admin/rollback-previews:
    post:
      tags:
        - AdminReview
      operationId: createAdminRollbackPreview
      security:
        - bearerAuth: []
      x-required-roles: # createAdminRollbackPreview
        - ADMIN
      summary: Create rollback preview for a target entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRollbackPreviewRequest'
      responses:
        '200':
          description: Rollback preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackPreviewResponse'
  /api/admin/rollbacks:
    post:
      tags:
        - AdminReview
      operationId: executeAdminRollback
      security:
        - bearerAuth: []
      x-required-roles: # executeAdminRollback
        - ADMIN
      summary: Execute a previously previewed rollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRollbackRequest'
      responses:
        '200':
          description: Rollback execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackExecutionResponse'
  /conversation-sessions/{sessionId}:
    get:
      tags:
        - Setlists
      operationId: getConversationSessionState
      security:
        - bearerAuth: []
      x-required-roles: # getConversationSessionState
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Read current conversation session state
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session state snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'
        '404':
          description: Session not found.

  /conversation-sessions/{sessionId}/slots:
    patch:
      tags:
        - Setlists
      operationId: updateConversationSessionSlots
      security:
        - bearerAuth: []
      x-required-roles: # updateConversationSessionSlots
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Merge slot updates into conversation session state
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSlotUpdateRequest'
      responses:
        '200':
          description: Updated state snapshot after deterministic merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'
        '409':
          description: Conflict or invalid state transition.

  /conversation-sessions/{sessionId}/clarify:
    post:
      tags:
        - Setlists
      operationId: requestConversationClarification
      security:
        - bearerAuth: []
      x-required-roles: # requestConversationClarification
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Submit clarification answer and return updated state
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationClarificationRequest'
      responses:
        '200':
          description: Updated session state after clarification merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'

  /conversation-sessions/{sessionId}/confirm:
    post:
      tags:
        - Setlists
      operationId: confirmConversationSession
      security:
        - bearerAuth: []
      x-required-roles: # confirmConversationSession
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Confirm normalized request and transition to CONFIRMED
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationConfirmRequest'
      responses:
        '200':
          description: Confirmed session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'
        '409':
          description: Session not ready to confirm.

  /conversation-sessions/{sessionId}/cancel:
    post:
      tags:
        - Setlists
      operationId: cancelConversationSession
      security:
        - bearerAuth: []
      x-required-roles: # cancelConversationSession
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Cancel active session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'

  /conversation-sessions/{sessionId}/recover:
    post:
      tags:
        - Setlists
      operationId: recoverConversationSession
      security:
        - bearerAuth: []
      x-required-roles: # recoverConversationSession
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Recover from an expired session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recovery options and a restarted or resumed state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRecoveryResponse'

  /setlists/proposals/natural-language:
    post:
      tags:
        - Setlists
      operationId: generateSetlistProposalFromNaturalLanguage
      security:
        - bearerAuth: []
      x-required-roles: # generateSetlistProposalFromNaturalLanguage
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Generate a setlist proposal from natural-language text
      description: >-
        Accepts raw user text, invokes the LLM intent boundary, validates the
        resulting contract payload, applies backend defaults, and invokes
        recommendation only for valid GENERATE_SETLIST intents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalLanguageSetlistRequest'
      responses:
        '202':
          description: Setlist proposal accepted, clarification requested, or safely rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistProposalResponse'
        '400':
          description: Request validation failed.
  /setlists/proposals:
    post:
      tags:
        - Setlists
      operationId: generateSetlistProposal
      summary: Generate a setlist proposal from structured intent slots
      description: >-
        Accepts structured slots produced by the intent parser. Song selection remains
        backend-only and must use approved catalog data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSetlistRequest'
      responses:
        '202':
          description: Setlist proposal accepted or safely deferred until catalog support is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistProposalResponse'
        '400':
          description: Request validation failed.
  /setlists:
    post:
      tags:
        - Setlists
      operationId: createSetlistBaselineVersion
      security:
        - bearerAuth: []
      x-required-roles: # createSetlistBaselineVersion
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Persist a generated setlist baseline as version 1
      description: >-
        Stores the deterministic recommendation output and immutable generation context.
        The resulting resource is identified by a logical setlist_id and immutable version_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetlistBaselineRequest'
      responses:
        '201':
          description: Baseline version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionEnvelope'
        '400':
          description: Request validation failed.
  /setlists/{setlistId}/edits:
    post:
      tags:
        - Setlists
      operationId: commitSetlistEdits
      security:
        - bearerAuth: []
      x-required-roles: # commitSetlistEdits
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Commit auditable edit operations as a new immutable version
      parameters:
        - in: path
          name: setlistId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitSetlistEditsRequest'
      responses:
        '201':
          description: Edit operations committed and a new immutable version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionEnvelope'
        '404':
          description: Setlist or base version does not exist.
        '409':
          description: Base version is locked or is not the latest permitted editable ancestor.
  /setlists/{setlistId}/versions:
    get:
      tags:
        - Setlists
      operationId: listSetlistVersions
      security:
        - bearerAuth: []
      x-required-roles: # listSetlistVersions
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: List immutable versions for a setlist lineage
      parameters:
        - in: path
          name: setlistId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordered version lineage metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionListResponse'
        '404':
          description: Setlist not found.
  /setlists/{setlistId}/versions/{versionId}:
    get:
      tags:
        - Setlists
      operationId: getSetlistVersion
      security:
        - bearerAuth: []
      x-required-roles: # getSetlistVersion
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Retrieve a specific immutable setlist version snapshot
      parameters:
        - in: path
          name: setlistId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: versionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Immutable snapshot and provenance details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionEnvelope'
        '404':
          description: Setlist or version not found.
  /setlists/{setlistId}/versions/{fromVersionId}/diff/{toVersionId}:
    get:
      tags:
        - Setlists
      operationId: diffSetlistVersions
      security:
        - bearerAuth: []
      x-required-roles: # diffSetlistVersions
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Compare two immutable versions in the same setlist lineage
      parameters:
        - in: path
          name: setlistId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: fromVersionId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: toVersionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deterministic structural and attribute diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionDiffResponse'
        '404':
          description: Setlist or requested versions not found.
  /service-plans:
    post:
      tags:
        - ServicePlans
      operationId: createServicePlan
      security:
        - bearerAuth: []
      x-required-roles: # createServicePlan
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Create a draft service plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServicePlanRequest'
      responses:
        '201':
          description: Draft service plan created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanResponse'
    get:
      tags:
        - ServicePlans
      operationId: listServicePlans
      security:
        - bearerAuth: []
      x-required-roles: # listServicePlans
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: List service plans
      responses:
        '200':
          description: Service plans matching filter criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePlanSummary'

  /service-plans/{servicePlanId}:
    get:
      tags:
        - ServicePlans
      operationId: getServicePlan
      security:
        - bearerAuth: []
      x-required-roles: # getServicePlan
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Retrieve a service plan
      parameters:
        - in: path
          name: servicePlanId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service plan detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanResponse'
        '404':
          description: Service plan not found.
    patch:
      tags:
        - ServicePlans
      operationId: updateServicePlan
      security:
        - bearerAuth: []
      x-required-roles: # updateServicePlan
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Update mutable draft service-plan metadata
      parameters:
        - in: path
          name: servicePlanId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServicePlanRequest'
      responses:
        '200':
          description: Updated service plan detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanResponse'

  /service-plans/{servicePlanId}/blocks:order:
    post:
      tags:
        - ServicePlans
      operationId: reorderServicePlanBlocks
      security:
        - bearerAuth: []
      x-required-roles: # reorderServicePlanBlocks
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Reorder service-plan blocks within a draft
      parameters:
        - in: path
          name: servicePlanId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderServicePlanBlocksRequest'
      responses:
        '200':
          description: Updated block ordering and effective sequence preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanResponse'

  /service-plans/{servicePlanId}/setlist-attachments:
    post:
      tags:
        - ServicePlans
      operationId: attachSetlistVersionToServicePlan
      security:
        - bearerAuth: []
      x-required-roles: # attachSetlistVersionToServicePlan
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Attach an immutable setlist version to a service plan
      parameters:
        - in: path
          name: servicePlanId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachSetlistVersionRequest'
      responses:
        '201':
          description: Setlist version attachment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanSetlistAttachmentResponse'

  /service-plans/{servicePlanId}/publish:
    post:
      tags:
        - ServicePlans
      operationId: publishServicePlan
      security:
        - bearerAuth: []
      x-required-roles: # publishServicePlan
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Publish a service plan and persist immutable effective sequence
      parameters:
        - in: path
          name: servicePlanId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishServicePlanRequest'
      responses:
        '200':
          description: Service plan published with immutable snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanPublishResponse'
        '409':
          description: Service plan cannot be published due to validation or stale references.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FeedbackOutcome:
      type: string
      enum:
        - accepted
        - rejected
        - skipped
        - favorited
    FeedbackScopeLayer:
      type: string
      description: Deterministic preference precedence is personal then team then policy/global.
      enum:
        - personal
        - team
        - policy_global
    FeedbackReplacementReason:
      type: string
      description: Controlled taxonomy for replace/reject/skipped rationales used for tuning.
      enum:
        - theological_mismatch
        - congregational_familiarity_low
        - vocal_range_mismatch
        - key_center_flow
        - tempo_flow
        - instrumentation_fit
        - seasonal_mismatch
        - service_moment_mismatch
        - duplicate_recent_usage
        - pastoral_direction
    CreateFeedbackEventRequest:
      type: object
      additionalProperties: false
      required:
        - setlistId
        - arrangementId
        - outcome
        - scopeLayer
        - scopeId
      properties:
        setlistId:
          type: string
          format: uuid
        setlistVersionId:
          type: string
          format: uuid
          nullable: true
        arrangementId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/FeedbackOutcome'
        replacementReason:
          $ref: '#/components/schemas/FeedbackReplacementReason'
        replacedWithArrangementId:
          type: string
          format: uuid
          nullable: true
        familiarityScore:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
        serviceType:
          type: string
          nullable: true
          description: Optional service context (for example youth or prayer-night).
        scopeLayer:
          $ref: '#/components/schemas/FeedbackScopeLayer'
        scopeId:
          type: string
          format: uuid
        actorId:
          type: string
          minLength: 1
      description: >
        Explicit feedback payload used by deterministic scoring profiles.
        Free-form scoring reason codes are not accepted.
    FeedbackEventResponse:
      type: object
      additionalProperties: false
      required:
        - feedbackEventId
        - setlistId
        - arrangementId
        - outcome
        - scopeLayer
        - scopeId
        - createdAt
      properties:
        feedbackEventId:
          type: string
          format: uuid
        setlistId:
          type: string
          format: uuid
        setlistVersionId:
          type: string
          format: uuid
          nullable: true
        arrangementId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/FeedbackOutcome'
        replacementReason:
          $ref: '#/components/schemas/FeedbackReplacementReason'
        replacedWithArrangementId:
          type: string
          format: uuid
          nullable: true
        familiarityScore:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
        scopeLayer:
          $ref: '#/components/schemas/FeedbackScopeLayer'
        scopeId:
          type: string
          format: uuid
        actorId:
          type: string
        createdAt:
          type: string
          format: date-time
    FeedbackScopeStateResponse:
      type: object
      additionalProperties: false
      required:
        - scopeLayer
        - scopeId
        - counters
      properties:
        scopeLayer:
          $ref: '#/components/schemas/FeedbackScopeLayer'
        scopeId:
          type: string
          format: uuid
        counters:
          type: object
          additionalProperties: false
          required:
            - accepted
            - rejected
            - skipped
            - favorited
          properties:
            accepted:
              type: integer
              format: int64
              minimum: 0
            rejected:
              type: integer
              format: int64
              minimum: 0
            skipped:
              type: integer
              format: int64
              minimum: 0
            favorited:
              type: integer
              format: int64
              minimum: 0
        replacementReasonCounts:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        lastFeedbackAt:
          type: string
          format: date-time
          nullable: true
    FeedbackResetRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
        actorId:
          type: string
          minLength: 1
    FeedbackResetResponse:
      type: object
      additionalProperties: false
      required:
        - scopeLayer
        - scopeId
        - resetAt
      properties:
        scopeLayer:
          $ref: '#/components/schemas/FeedbackScopeLayer'
        scopeId:
          type: string
          format: uuid
        resetAt:
          type: string
          format: date-time
        actorId:
          type: string
        auditReference:
          type: string
          description: Identifier of append-only reset audit event.
    NaturalLanguageSetlistRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: Raw natural-language user request to extract into the intent contract.
          example: Build a thanksgiving set around Psalm 100 with 4 praise songs and 2 worship songs.
    GenerateSetlistRequest:
      type: object
      additionalProperties: false
      required:
        - verseText
        - counts
        - keyPolicy
        - tempoPolicy
      properties:
        verseText:
          type: string
          minLength: 1
          description: Scripture text or reference that frames the setlist.
          example: Psalm 100
        scriptureReferences:
          type: array
          description: Optional normalized scripture references explicitly provided or confidently extracted.
          items:
            type: string
          default: []
          example:
            - Psalm 100
        themeHints:
          type: array
          description: Optional controlled or free-form theme hints extracted from the user prompt.
          items:
            type: string
          default: []
          example:
            - thanksgiving
        counts:
          $ref: '#/components/schemas/SetlistCounts'
        keyPolicy:
          $ref: '#/components/schemas/KeyPolicy'
        tempoPolicy:
          $ref: '#/components/schemas/TempoPolicy'
        language:
          type: string
          nullable: true
          description: Requested language when supplied by the user.
          example: Spanish
        energyArc:
          type: string
          nullable: true
          enum:
            - steady
            - rising
            - falling
            - low_to_high
            - high_to_low
          description: Requested energy shape when supplied by the user.
        excludedSongs:
          type: array
          description: User-provided exclusions by title or catalog reference; never selected by the LLM.
          items:
            type: string
          default: []
          example:
            - Example Song To Avoid
        serviceMoment:
          type: string
          nullable: true
          enum:
            - opening
            - communion
            - response
            - altar_call
            - sending
            - other
          description: Controlled service moment when supplied by the user.
    SetlistCounts:
      type: object
      additionalProperties: false
      required:
        - praise
        - worship
      properties:
        praise:
          type: integer
          format: int32
          minimum: 0
          maximum: 25
          default: 10
        worship:
          type: integer
          format: int32
          minimum: 0
          maximum: 25
          default: 5
    KeyPolicy:
      type: object
      additionalProperties: false
      required:
        - preferSameKey
        - allowRelativeMajorMinor
        - maxKeyCenters
      properties:
        preferSameKey:
          type: boolean
          default: true
        allowRelativeMajorMinor:
          type: boolean
          default: true
        maxKeyCenters:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          default: 2
    TempoPolicy:
      type: object
      additionalProperties: false
      required:
        - maxJumpBpm
      properties:
        maxJumpBpm:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 12
    SetlistProposalResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - auditMessages
      properties:
        status:
          type: string
          description: Machine-readable proposal status.
          example: PENDING_CATALOG_IMPLEMENTATION
        auditMessages:
          type: array
          description: Transparent safety and processing messages for the proposal.
          items:
            type: string
          example:
            - Recommendation Engine scaffold accepted the structured request.
            - No songs were selected because catalog retrieval is not implemented yet.
    SetlistProvenanceType:
      type: string
      enum:
        - GENERATED_BASELINE
        - MANUAL_EDIT
    SetlistItemChangeType:
      type: string
      enum:
        - UNCHANGED
        - ADDED
        - REMOVED
        - REORDERED
        - REPLACED
        - TRANSPOSED
    SetlistVersionStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - LOCKED
    CreateSetlistBaselineRequest:
      type: object
      additionalProperties: false
      required:
        - request
        - parsedIntent
        - engineProfileVersion
        - items
      properties:
        request:
          $ref: '#/components/schemas/GenerateSetlistRequest'
        parsedIntent:
          description: Validated intent payload used by recommendation.
          type: object
          additionalProperties: true
        engineProfileVersion:
          type: string
          minLength: 1
          description: Recommendation/scoring engine profile version identifier.
          example: scoring-profile-2026.05.1
        explanationFacts:
          type: array
          items:
            type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SetlistVersionItem'
    CommitSetlistEditsRequest:
      type: object
      additionalProperties: false
      required:
        - baseVersionId
        - operations
      properties:
        baseVersionId:
          type: string
          format: uuid
        actorId:
          type: string
          description: Authenticated actor committing the edit transaction.
        operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SetlistEditOperation'
    SetlistEditOperation:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - REORDER
            - REPLACE
            - REMOVE
            - TRANSPOSE
        itemId:
          type: string
          format: uuid
          description: Target item in base version for remove, replace, and transpose.
        fromPosition:
          type: integer
          format: int32
          minimum: 1
        toPosition:
          type: integer
          format: int32
          minimum: 1
        replacementArrangementId:
          type: string
          format: uuid
          description: Catalog arrangement reference for replace action.
        semitoneDelta:
          type: integer
          format: int32
          minimum: -12
          maximum: 12
          description: Relative transpose adjustment for transpose action.
    SetlistVersionListResponse:
      type: object
      additionalProperties: false
      required:
        - setlistId
        - versions
      properties:
        setlistId:
          type: string
          format: uuid
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SetlistVersionSummary'
    SetlistVersionSummary:
      type: object
      additionalProperties: false
      required:
        - versionId
        - versionNumber
        - provenance
        - status
      properties:
        versionId:
          type: string
          format: uuid
        parentVersionId:
          type: string
          format: uuid
          nullable: true
        versionNumber:
          type: integer
          format: int32
          minimum: 1
        provenance:
          $ref: '#/components/schemas/SetlistProvenanceType'
        status:
          $ref: '#/components/schemas/SetlistVersionStatus'
        createdAt:
          type: string
          format: date-time
    SetlistVersionEnvelope:
      type: object
      additionalProperties: false
      required:
        - setlistId
        - version
      properties:
        setlistId:
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/SetlistVersion'
    SetlistVersion:
      allOf:
        - $ref: '#/components/schemas/SetlistVersionSummary'
        - type: object
          additionalProperties: false
          required:
            - engineProfileVersion
            - items
          properties:
            request:
              $ref: '#/components/schemas/GenerateSetlistRequest'
            parsedIntent:
              type: object
              additionalProperties: true
            engineProfileVersion:
              type: string
            explanationFacts:
              type: array
              items:
                type: string
            items:
              type: array
              items:
                $ref: '#/components/schemas/SetlistVersionItem'
    SetlistVersionItem:
      type: object
      additionalProperties: false
      required:
        - itemId
        - position
        - catalogArrangementId
        - provenance
      properties:
        itemId:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        catalogArrangementId:
          type: string
          format: uuid
        transposeSemitones:
          type: integer
          format: int32
          minimum: -12
          maximum: 12
          default: 0
        provenance:
          $ref: '#/components/schemas/SetlistProvenanceType'
    SetlistVersionDiffResponse:
      type: object
      additionalProperties: false
      required:
        - setlistId
        - fromVersionId
        - toVersionId
        - operations
      properties:
        setlistId:
          type: string
          format: uuid
        fromVersionId:
          type: string
          format: uuid
        toVersionId:
          type: string
          format: uuid
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SetlistDiffOperation'
    SetlistDiffOperation:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/SetlistItemChangeType'
        itemId:
          type: string
          format: uuid
        previousPosition:
          type: integer
          format: int32
          minimum: 1
        newPosition:
          type: integer
          format: int32
          minimum: 1
        previousCatalogArrangementId:
          type: string
          format: uuid
        newCatalogArrangementId:
          type: string
          format: uuid
        previousTransposeSemitones:
          type: integer
          format: int32
        newTransposeSemitones:
          type: integer
          format: int32

    ConversationState:
      type: string
      enum: [START, COLLECTING, CLARIFICATION_REQUIRED, READY_TO_CONFIRM, CONFIRMED, EXPIRED, CANCELLED]
    SlotValueSource:
      type: string
      enum: [menu, free_text, default, user_edit]
    ChannelType:
      type: string
      enum: [menu, free_text, mixed]
    ConversationSlotSource:
      type: object
      additionalProperties: false
      required: [slot, source]
      properties:
        slot:
          type: string
          enum: [verseText, scriptureReferences, themeHints, counts, keyPolicy, tempoPolicy, language, energyArc, excludedSongs, serviceMoment]
        source:
          $ref: '#/components/schemas/SlotValueSource'
        updatedAt:
          type: string
          format: date-time
    ConversationRevisionEvent:
      type: object
      additionalProperties: false
      required: [eventId, eventType, source, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [slot_update, clarification_answer, confirm, cancel, expire, recover]
        source:
          $ref: '#/components/schemas/SlotValueSource'
        occurredAt:
          type: string
          format: date-time
        summary:
          type: string
    ConversationSessionStateResponse:
      type: object
      additionalProperties: false
