      type: string
      enum: [setlist_version, manual]
    ServicePlanSummary:
      type: object
      required: [servicePlanId, title, serviceDateTime, status]
      properties:
        servicePlanId: { type: string, format: uuid }
        title: { type: string }
        serviceDateTime: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ServicePlanStatus' }
    CreateServicePlanRequest:
      type: object
      additionalProperties: false
      required: [serviceDateTime, title]
      properties:
        serviceDateTime: { type: string, format: date-time }
        title: { type: string, minLength: 1, maxLength: 160 }
        theme: { type: string, nullable: true }
        scripture: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    UpdateServicePlanRequest:
      allOf:
        - $ref: '#/components/schemas/CreateServicePlanRequest'
    AttachSetlistVersionRequest:
      type: object
      additionalProperties: false
      required: [setlistId, setlistVersionId]
      properties:
        setlistId: { type: string, format: uuid }
        setlistVersionId: { type: string, format: uuid }
        placementIndex: { type: integer, minimum: 0, nullable: true }
        notes: { type: string, nullable: true }
    ServicePlanSetlistAttachmentResponse:
      type: object
      required: [attachmentId, servicePlanId, setlistId, setlistVersionId]
      properties:
        attachmentId: { type: string, format: uuid }
        servicePlanId: { type: string, format: uuid }
        setlistId: { type: string, format: uuid }
        setlistVersionId: { type: string, format: uuid }
        attachedAt: { type: string, format: date-time }
    ServicePlanBlockProvenance:
      type: object
      properties:
        sourceType: { $ref: '#/components/schemas/ServicePlanBlockSourceType' }
        setlistId: { type: string, format: uuid, nullable: true }
        setlistVersionId: { type: string, format: uuid, nullable: true }
        setlistEntryId: { type: string, format: uuid, nullable: true }
    ServicePlanBlock:
      type: object
      required: [blockId, orderIndex, type, title, provenance]
      properties:
        blockId: { type: string, format: uuid }
        orderIndex: { type: integer, minimum: 0 }
        type: { $ref: '#/components/schemas/ServicePlanBlockType' }
        title: { type: string }
        notes: { type: string, nullable: true }
        serviceTransposeSemitones: { type: integer, nullable: true }
        serviceKeyOverride: { type: string, nullable: true }
        provenance:
          $ref: '#/components/schemas/ServicePlanBlockProvenance'
    ReorderServicePlanBlocksRequest:
      type: object
      additionalProperties: false
      required: [orderedBlockIds]
      properties:
        orderedBlockIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    ServicePlanEffectiveSequenceSnapshot:
      type: object
      required: [snapshotId, capturedAt, blocks]
      properties:
        snapshotId: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ServicePlanBlock' }
    ServicePlanResponse:
      type: object
      required: [servicePlanId, serviceDateTime, title, status, blocks, setlistAttachments]
      properties:
        servicePlanId: { type: string, format: uuid }
        serviceDateTime: { type: string, format: date-time }
        title: { type: string }
        theme: { type: string, nullable: true }
        scripture: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ServicePlanStatus' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ServicePlanBlock' }
        setlistAttachments:
          type: array
          items: { $ref: '#/components/schemas/ServicePlanSetlistAttachmentResponse' }
        effectiveSequenceSnapshot:
          $ref: '#/components/schemas/ServicePlanEffectiveSequenceSnapshot'
          nullable: true
    PublishServicePlanRequest:
      type: object
      additionalProperties: false
      properties:
        expectedRevision: { type: integer, minimum: 0, nullable: true }
        publishNote: { type: string, nullable: true }
    ServicePlanPublishResponse:
      allOf:
        - $ref: '#/components/schemas/ServicePlanResponse'
        - type: object
          required: [publishedAt, publishedBy]
          properties:
            publishedAt: { type: string, format: date-time }
            publishedBy: { type: string }
