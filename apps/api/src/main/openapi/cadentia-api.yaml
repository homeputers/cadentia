      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRehearsalAssignmentRequest'
      responses:
        '201':
          description: Rehearsal assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRehearsalAssignmentResponse'
  /team-assignments/services/{servicePlanId}/song-overrides:
    post:
      tags: [TeamAssignments]
      operationId: createSongTeamAssignmentOverride
      security:
        - bearerAuth: []
      x-required-roles: [WORSHIP_LEADER, TEAM_SCHEDULER, ADMIN]
      summary: Create a song-specific assignment override
      description: Assigns a controlled responsibility for a specific song block without changing catalog approval gates.
      parameters:
        - $ref: '#/components/parameters/ServicePlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamSongAssignmentOverrideRequest'
      responses:
        '201':
          description: Song-specific override created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSongAssignmentOverrideResponse'
  /team-assignments/services/{servicePlanId}/roster:
    get:
      tags: [TeamAssignments]
      operationId: getServiceTeamRoster
      security:
        - bearerAuth: []
      x-required-roles: [WORSHIP_LEADER, TEAM_SCHEDULER, REPORTING_VIEWER, ADMIN]
      summary: Get a privacy-aware service roster summary
      parameters:
        - $ref: '#/components/parameters/ServicePlanId'
      responses:
        '200':
          description: Service roster summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamServiceRosterResponse'
  /team-assignments/musicians/{musicianId}/upcoming:
    get:
      tags: [TeamAssignments]
      operationId: listUpcomingTeamAssignmentsForMusician
      security:
        - bearerAuth: []
      x-required-roles: [ASSIGNED_MUSICIAN, WORSHIP_LEADER, TEAM_SCHEDULER, ADMIN]
      summary: List upcoming service assignments for a musician
      parameters:
        - in: path
          name: musicianId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: fromInclusive
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Upcoming service assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamServiceAssignmentResponse'
  /team-assignments/services/{servicePlanId}/history:
    get:
      tags: [TeamAssignments]
      operationId: listTeamAssignmentHistory
      security:
        - bearerAuth: []
      x-required-roles: [WORSHIP_LEADER, TEAM_SCHEDULER, REPORTING_VIEWER, ADMIN]
      summary: List assignment change history for a service
      parameters:
        - $ref: '#/components/parameters/ServicePlanId'
      responses:
        '200':
          description: Assignment change history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamAssignmentHistoryResponse'

components:
  parameters:
    ServicePlanId:
      in: path
      name: servicePlanId
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:

    TeamMusicianRoleCode:
      type: string
      enum: [WORSHIP_LEADER, VOCALIST, INSTRUMENTALIST, MUSIC_DIRECTOR, TECH]
    TeamInstrumentCode:
      type: string
      enum: [ACOUSTIC_GUITAR, ELECTRIC_GUITAR, PIANO, KEYS, BASS, DRUMS, PERCUSSION, BRASS, WINDS, OTHER]
    TeamVocalPartCode:
      type: string
      enum: [LEAD, ALTO, TENOR, BARITONE, SOPRANO, BACKGROUND]
    TeamAssignmentStatusCode:
      type: string
      enum: [REQUESTED, TENTATIVE, ACCEPTED, DECLINED, UNAVAILABLE, SUBSTITUTE]
    TeamAssignmentType:
      type: string
      enum: [SERVICE, REHEARSAL, SONG_OVERRIDE]
    TeamServiceAssignmentRequest:
      type: object
      additionalProperties: false
      required: [musicianId, roleCode, statusCode]
      properties:
        musicianId: { type: string, format: uuid }
        roleCode: { $ref: '#/components/schemas/TeamMusicianRoleCode' }
        instrumentCode:
          $ref: '#/components/schemas/TeamInstrumentCode'
        vocalPartCode:
          $ref: '#/components/schemas/TeamVocalPartCode'
        statusCode: { $ref: '#/components/schemas/TeamAssignmentStatusCode' }
        assignmentOrder: { type: integer, minimum: 0, nullable: true }
        overrideUnavailable: { type: boolean, default: false }
        reasonCode: { type: string, nullable: true }
        reference: { type: string, nullable: true }
    TeamServiceAssignmentResponse:
      type: object
      required: [assignmentId, servicePlanId, musicianId, roleCode, statusCode]
      properties:
        assignmentId: { type: string, format: uuid }
        servicePlanId: { type: string, format: uuid }
        musicianId: { type: string, format: uuid }
        roleCode: { $ref: '#/components/schemas/TeamMusicianRoleCode' }
        instrumentCode:
          $ref: '#/components/schemas/TeamInstrumentCode'
        vocalPartCode:
          $ref: '#/components/schemas/TeamVocalPartCode'
        statusCode: { $ref: '#/components/schemas/TeamAssignmentStatusCode' }
        assignmentOrder: { type: integer, minimum: 0, nullable: true }
        substituteForAssignmentId: { type: string, format: uuid, nullable: true }
    TeamRehearsalAssignmentRequest:
      type: object
      additionalProperties: false
      required: [servicePlanId, musicianId, roleCode, statusCode]
      properties:
        servicePlanId: { type: string, format: uuid }
        serviceAssignmentId: { type: string, format: uuid, nullable: true }
        musicianId: { type: string, format: uuid }
        roleCode: { $ref: '#/components/schemas/TeamMusicianRoleCode' }
        instrumentCode:
          $ref: '#/components/schemas/TeamInstrumentCode'
        vocalPartCode:
          $ref: '#/components/schemas/TeamVocalPartCode'
        statusCode: { $ref: '#/components/schemas/TeamAssignmentStatusCode' }
        substituteForAssignmentId: { type: string, format: uuid, nullable: true }
        overrideUnavailable: { type: boolean, default: false }
        reasonCode: { type: string, nullable: true }
        reference: { type: string, nullable: true }
    TeamRehearsalAssignmentResponse:
      type: object
      required: [assignmentId, rehearsalEventId, servicePlanId, musicianId, roleCode, statusCode]
      properties:
        assignmentId: { type: string, format: uuid }
        rehearsalEventId: { type: string, format: uuid }
        servicePlanId: { type: string, format: uuid }
        musicianId: { type: string, format: uuid }
        roleCode: { $ref: '#/components/schemas/TeamMusicianRoleCode' }
        instrumentCode:
          $ref: '#/components/schemas/TeamInstrumentCode'
        vocalPartCode:
          $ref: '#/components/schemas/TeamVocalPartCode'
        statusCode: { $ref: '#/components/schemas/TeamAssignmentStatusCode' }
        serviceAssignmentId: { type: string, format: uuid, nullable: true }
        substituteForAssignmentId: { type: string, format: uuid, nullable: true }
    TeamSongAssignmentOverrideRequest:
      type: object
      additionalProperties: false
      required: [servicePlanBlockId, baseServiceAssignmentId, musicianId, roleCode, statusCode]
      properties:
        servicePlanBlockId: { type: string, format: uuid }
        baseServiceAssignmentId: { type: string, format: uuid }
        musicianId: { type: string, format: uuid }
        roleCode: { $ref: '#/components/schemas/TeamMusicianRoleCode' }
        instrumentCode:
          $ref: '#/components/schemas/TeamInstrumentCode'
        vocalPartCode:
          $ref: '#/components/schemas/TeamVocalPartCode'
        statusCode: { $ref: '#/components/schemas/TeamAssignmentStatusCode' }
        reasonCode: { type: string, nullable: true }
        reference: { type: string, nullable: true }
    TeamSongAssignmentOverrideResponse:
      type: object
      required: [overrideId, servicePlanId, servicePlanBlockId, baseServiceAssignmentId, musicianId, roleCode, statusCode]
      properties:
        overrideId: { type: string, format: uuid }
        servicePlanId: { type: string, format: uuid }
        servicePlanBlockId: { type: string, format: uuid }
        baseServiceAssignmentId: { type: string, format: uuid }
        musicianId: { type: string, format: uuid }
        roleCode: { $ref: '#/components/schemas/TeamMusicianRoleCode' }
        instrumentCode:
          $ref: '#/components/schemas/TeamInstrumentCode'
        vocalPartCode:
          $ref: '#/components/schemas/TeamVocalPartCode'
        statusCode: { $ref: '#/components/schemas/TeamAssignmentStatusCode' }
    TeamSubstituteAssignmentRequest:
      type: object
      additionalProperties: false
      required: [substituteMusicianId]
      properties:
        substituteMusicianId: { type: string, format: uuid }
        statusCode: { $ref: '#/components/schemas/TeamAssignmentStatusCode' }
        overrideUnavailable: { type: boolean, default: false }
        reasonCode: { type: string, nullable: true }
        reference: { type: string, nullable: true }
    TeamReorderAssignmentsRequest:
      type: object
      additionalProperties: false
      required: [orderedAssignmentIds]
      properties:
        orderedAssignmentIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        reasonCode: { type: string, nullable: true }
        reference: { type: string, nullable: true }
    TeamServiceRosterResponse:
      type: object
      required: [servicePlanId, assignments, staffingGaps, availabilityConflicts]
      properties:
        servicePlanId: { type: string, format: uuid }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/TeamServiceAssignmentResponse' }
        staffingGaps:
          type: array
          items: { type: string }
        availabilityConflicts:
          type: array
          items: { type: string }
    TeamAssignmentHistoryResponse:
      type: object
      required: [historyId, assignmentType, assignmentId, servicePlanId, changeAction, changedBy, reasonCode, changedAt]
      properties:
        historyId: { type: string, format: uuid }
        assignmentType: { $ref: '#/components/schemas/TeamAssignmentType' }
        assignmentId: { type: string, format: uuid }
        servicePlanId: { type: string, format: uuid }
        rehearsalEventId: { type: string, format: uuid, nullable: true }
        musicianId: { type: string, format: uuid, nullable: true }
        roleCode: { $ref: '#/components/schemas/TeamMusicianRoleCode' }
        instrumentCode:
          $ref: '#/components/schemas/TeamInstrumentCode'
        vocalPartCode:
          $ref: '#/components/schemas/TeamVocalPartCode'
        statusCode: { $ref: '#/components/schemas/TeamAssignmentStatusCode' }
        assignmentOrder: { type: integer, nullable: true }
        substituteForAssignmentId: { type: string, format: uuid, nullable: true }
        serviceAssignmentId: { type: string, format: uuid, nullable: true }
        changeAction: { type: string }
        changedBy: { type: string }
        reasonCode: { type: string }
        reference: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }
    FeedbackOutcome:
      type: string
      enum:
        - accepted
        - rejected
        - skipped
        - favorited
    FeedbackScopeLayer:
      type: string
      description: Deterministic preference precedence is personal then team then policy/global.
      enum:
        - personal
        - team
        - policy_global
    FeedbackReplacementReason:
      type: string
      description: Controlled taxonomy for replace/reject/skipped rationales used for tuning.
      enum:
        - theological_mismatch
        - congregational_familiarity_low
        - vocal_range_mismatch
        - key_center_flow
        - tempo_flow
        - instrumentation_fit
        - seasonal_mismatch
        - service_moment_mismatch
        - duplicate_recent_usage
        - pastoral_direction
    CreateFeedbackEventRequest:
      type: object
      additionalProperties: false
      required:
        - setlistId
        - arrangementId
        - outcome
        - scopeLayer
        - scopeId
      properties:
        setlistId:
          type: string
          format: uuid
        setlistVersionId:
          type: string
          format: uuid
          nullable: true
        arrangementId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/FeedbackOutcome'
        replacementReason:
          $ref: '#/components/schemas/FeedbackReplacementReason'
        replacedWithArrangementId:
          type: string
          format: uuid
          nullable: true
        familiarityScore:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
        serviceType:
          type: string
          nullable: true
          description: Optional service context (for example youth or prayer-night).
        scopeLayer:
          $ref: '#/components/schemas/FeedbackScopeLayer'
        scopeId:
          type: string
          format: uuid
        actorId:
          type: string
          minLength: 1
      description: >
        Explicit feedback payload used by deterministic scoring profiles.
        Free-form scoring reason codes are not accepted.
    FeedbackEventResponse:
      type: object
      additionalProperties: false
      required:
        - feedbackEventId
        - setlistId
        - arrangementId
        - outcome
        - scopeLayer
        - scopeId
        - createdAt
      properties:
        feedbackEventId:
          type: string
          format: uuid
        setlistId:
          type: string
          format: uuid
        setlistVersionId:
          type: string
          format: uuid
          nullable: true
        arrangementId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/FeedbackOutcome'
        replacementReason:
          $ref: '#/components/schemas/FeedbackReplacementReason'
        replacedWithArrangementId:
          type: string
          format: uuid
          nullable: true
        familiarityScore:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
        scopeLayer:
          $ref: '#/components/schemas/FeedbackScopeLayer'
        scopeId:
          type: string
          format: uuid
        actorId:
          type: string
        createdAt:
          type: string
          format: date-time
    FeedbackScopeStateResponse:
      type: object
      additionalProperties: false
      required:
        - scopeLayer
        - scopeId
        - counters
      properties:
        scopeLayer:
          $ref: '#/components/schemas/FeedbackScopeLayer'
        scopeId:
          type: string
          format: uuid
        counters:
          type: object
          additionalProperties: false
          required:
            - accepted
            - rejected
            - skipped
            - favorited
          properties:
            accepted:
              type: integer
              format: int64
              minimum: 0
            rejected:
              type: integer
              format: int64
              minimum: 0
            skipped:
              type: integer
              format: int64
              minimum: 0
            favorited:
              type: integer
              format: int64
              minimum: 0
        replacementReasonCounts:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        lastFeedbackAt:
          type: string
          format: date-time
          nullable: true
    FeedbackResetRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
        actorId:
          type: string
          minLength: 1
    FeedbackResetResponse:
      type: object
      additionalProperties: false
      required:
        - scopeLayer
        - scopeId
        - resetAt
      properties:
        scopeLayer:
          $ref: '#/components/schemas/FeedbackScopeLayer'
        scopeId:
          type: string
          format: uuid
        resetAt:
          type: string
          format: date-time
        actorId:
          type: string
        auditReference:
          type: string
          description: Identifier of append-only reset audit event.
    NaturalLanguageSetlistRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: Raw natural-language user request to extract into the intent contract.
          example: Build a thanksgiving set around Psalm 100 with 4 praise songs and 2 worship songs.
    GenerateSetlistRequest:
      type: object
      additionalProperties: false
      required:
        - verseText
        - counts
        - keyPolicy
        - tempoPolicy
      properties:
        verseText:
          type: string
          minLength: 1
          description: Scripture text or reference that frames the setlist.
          example: Psalm 100
        scriptureReferences:
          type: array
          description: Optional normalized scripture references explicitly provided or confidently extracted.
          items:
            type: string
          default: []
          example:
            - Psalm 100
        themeHints:
          type: array
          description: Optional controlled or free-form theme hints extracted from the user prompt.
          items:
            type: string
          default: []
          example:
            - thanksgiving
        counts:
          $ref: '#/components/schemas/SetlistCounts'
        keyPolicy:
          $ref: '#/components/schemas/KeyPolicy'
        tempoPolicy:
          $ref: '#/components/schemas/TempoPolicy'
        language:
          type: string
          nullable: true
          description: Requested language when supplied by the user.
          example: Spanish
        energyArc:
          type: string
          nullable: true
          enum:
            - steady
            - rising
            - falling
            - low_to_high
            - high_to_low
          description: Requested energy shape when supplied by the user.
        excludedSongs:
          type: array
          description: User-provided exclusions by title or catalog reference; never selected by the LLM.
          items:
            type: string
          default: []
          example:
            - Example Song To Avoid
        serviceMoment:
          type: string
          nullable: true
          enum:
            - opening
            - communion
            - response
            - altar_call
            - sending
            - other
          description: Controlled service moment when supplied by the user.
        explanationAudience:
          type: string
          nullable: true
          enum:
            - public
            - worship_leader
            - admin
          default: public
          description: >-
            Requested explanation visibility mode. Admin mode requires an authorized
            admin authority and never changes recommendation selection, ordering, or scores.
        includeAdminDiagnostics:
          type: boolean
          default: false
          description: >-
            Requests admin-only diagnostics such as candidate exclusions, near misses,
            hard-filter reasons, score ranges, tie-break details, and constraint-relaxation rationale.
            Ignored unless explanationAudience is admin and the caller is authorized.
    SetlistCounts:
      type: object
      additionalProperties: false
      required:
        - praise
        - worship
      properties:
        praise:
          type: integer
          format: int32
          minimum: 0
          maximum: 25
          default: 10
        worship:
          type: integer
          format: int32
          minimum: 0
          maximum: 25
          default: 5
    KeyPolicy:
      type: object
      additionalProperties: false
      required:
        - preferSameKey
        - allowRelativeMajorMinor
        - maxKeyCenters
      properties:
        preferSameKey:
          type: boolean
          default: true
        allowRelativeMajorMinor:
          type: boolean
          default: true
        maxKeyCenters:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          default: 2
    TempoPolicy:
      type: object
      additionalProperties: false
      required:
        - maxJumpBpm
      properties:
        maxJumpBpm:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 12
    RecommendationExplanation:
      type: object
      additionalProperties: false
      description: >-
        Versioned, deterministic explanation payload for a recommendation response.
        Schema version `recommendation_explanation.v1` is additive-compatible only:
        optional fields and enum values may be added within v1, but existing public
        field names, meanings, and required fields are not removed or renamed.
        Breaking changes require a new schemaVersion and a migration window. Facts
        are produced by the Recommendation Engine from scoring, policy, transition,
        and approved catalog evidence; they are never generated by an LLM or supplied
        by the client as rationale.
      required:
        - schemaName
        - schemaVersion
        - generatedBy
        - requestId
        - recommendationResultId
        - scoringProfileVersion
        - catalogSnapshotVersion
        - generatedAt
        - requestPolicySummary
        - deterministicTieBreaks
        - selectedSongs
        - adjacentTransitions
        - setLevel
        - warnings
        - diagnostics
      properties:
        schemaName:
          type: string
          enum: [recommendation_explanation]
        schemaVersion:
          type: string
          enum: [recommendation_explanation.v1]
        generatedBy:
          type: string
          enum: [RecommendationEngine]
          description: Explicit boundary marker; explanation facts are generated by REng, not an LLM.
        requestId:
          type: string
          minLength: 1
          maxLength: 120
        correlationId:
          type: string
          minLength: 1
          maxLength: 120
        recommendationResultId:
          type: string
          minLength: 1
          maxLength: 120
        setlistId:
          type: string
          minLength: 1
          maxLength: 120
        scoringProfileVersion:
          type: string
          minLength: 1
          maxLength: 120
          description: Version of the deterministic scoring profile used for selection and ordering.
        catalogSnapshotVersion:
          type: string
          minLength: 1
          maxLength: 120
          description: Catalog snapshot/version used for candidate retrieval, scoring, and evidence references.
        generatedAt:
          type: string
          format: date-time
        requestPolicySummary:
          $ref: '#/components/schemas/RecommendationRequestPolicySummary'
        deterministicTieBreaks:
          type: array
          description: Populated only for deterministic tie-break rules that affected ordering or selection.
          items:
            $ref: '#/components/schemas/RecommendationTieBreakFact'
        selectedSongs:
          type: array
          description: Explanation entries for selected song/arrangement result items.
          items:
            $ref: '#/components/schemas/RecommendationExplanationEntry'
        adjacentTransitions:
          type: array
          description: Directional explanation entries for adjacent result-item transitions.
          items:
            $ref: '#/components/schemas/RecommendationExplanationEntry'
        setLevel:
          type: array
          description: Whole-set explanations such as counts, key centers, tempo policy, theme coverage, and energy arc.
          items:
            $ref: '#/components/schemas/RecommendationExplanationEntry'
        warnings:
          type: array
          description: User-safe warnings for insufficient catalog coverage, relaxed constraints, or low-confidence metadata.
          items:
            $ref: '#/components/schemas/RecommendationExplanationEntry'
        diagnostics:
          type: array
          description: Audience-partitioned diagnostics; admin-only entries must be redacted from public responses.
          items:
            $ref: '#/components/schemas/RecommendationExplanationEntry'
    RecommendationRequestPolicySummary:
      type: object
      additionalProperties: false
      required:
        - counts
        - keyPolicy
        - tempoPolicy
        - themeHints
        - scriptureReferences
        - appliedDefaults
      properties:
        counts:
          $ref: '#/components/schemas/SetlistCounts'
        keyPolicy:
          $ref: '#/components/schemas/KeyPolicy'
        tempoPolicy:
          $ref: '#/components/schemas/TempoPolicy'
        themeHints:
          type: array
          items:
            type: string
        scriptureReferences:
          type: array
          items:
            type: string
        language:
          type: string
          nullable: true
        energyArc:
          type: string
          nullable: true
        serviceMoment:
          type: string
          nullable: true
        appliedDefaults:
          type: array
          description: Request-policy fields defaulted by backend contract before recommendation.
          items:
            type: string
    RecommendationTieBreakFact:
      type: object
      additionalProperties: false
      required:
        - rule
        - direction
        - affectedResultIds
        - values
        - reasonCode
      properties:
        rule:
          type: string
          minLength: 1
          maxLength: 120
          example: arrangement_id
        direction:
          type: string
          enum: [asc, desc]
        affectedResultIds:
          type: array
          minItems: 1
          items:
            type: string
        values:
          type: object
          additionalProperties: true
          description: Scalar tie-break values keyed by result/item identifier.
        reasonCode:
          $ref: '#/components/schemas/RecommendationExplanationCode'
    RecommendationExplanationEntry:
      type: object
      additionalProperties: false
      required:
        - code
        - severity
        - scope
        - audience
        - subject
        - templateKey
        - values
        - evidence
      properties:
        code:
          $ref: '#/components/schemas/RecommendationExplanationCode'
        severity:
          type: string
          enum: [info, warning, blocked]
        scope:
          $ref: '#/components/schemas/RecommendationExplanationScope'
        audience:
          type: string
          enum: [public, worship_leader, admin]
        subject:
          $ref: '#/components/schemas/RecommendationExplanationSubject'
        templateKey:
          type: string
          minLength: 1
          maxLength: 120
          description: Stable localization key; rendered prose is not source-of-truth.
        defaultText:
          type: string
          maxLength: 280
          description: Optional fallback copy only; clients must use structured fields for logic and tests.
        values:
          type: object
          additionalProperties: true
          description: Scalar template values keyed by stable machine-readable names.
        evidence:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/RecommendationExplanationEvidence'
        scoreImpact:
          type: number
          format: double
    RecommendationExplanationScope:
      type: string
      enum:
        - selected_song
        - adjacent_transition
        - set_level
        - warning
        - diagnostic
    RecommendationExplanationSubject:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [song, arrangement, transition, set, candidate, policy, catalog]
        id:
          type: string
          minLength: 1
          maxLength: 120
        itemId:
          type: string
          maxLength: 120
        songId:
          type: string
          maxLength: 120
        arrangementId:
          type: string
          maxLength: 120
        sourceItemId:
          type: string
          maxLength: 120
        targetItemId:
          type: string
          maxLength: 120
        sourceArrangementId:
          type: string
          maxLength: 120
        targetArrangementId:
          type: string
          maxLength: 120
    RecommendationExplanationEvidence:
      type: object
      additionalProperties: false
      required:
        - type
        - ref
      properties:
        type:
          type: string
          enum: [catalog, request, score, transition, approval, provenance, policy, diagnostic]
        ref:
          type: string
          minLength: 1
          maxLength: 240
        field:
          type: string
          maxLength: 120
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
    RecommendationExplanationCode:
      type: string
      description: >-
        Governed recommendation explanation reason code. Codes are backend-owned,
        stable for recommendation_explanation.v1 clients, and rendered through
        registry localization keys rather than client-invented prose.
      enum:
        - ROLE_FIT
        - APPROVAL_ELIGIBLE
        - THEME_MATCH
        - SCRIPTURE_MATCH
        - SCORE_COMPONENT_MUSICAL_FIT
        - SCORE_COMPONENT_ENERGY_FIT
        - METADATA_LOW_CONFIDENCE
        - FEEDBACK_TUNING
        - SAME_KEY_TRANSITION
        - RELATIVE_KEY_TRANSITION
        - CLOSE_KEY_TRANSITION
        - MODULATION_PENALTY
        - TEMPO_POLICY_OK
        - METER_COMPATIBLE
        - ENERGY_ARC_MATCH
        - SET_ENERGY_ARC_MATCH
        - COUNT_TARGET_MET
        - KEY_CENTER_POLICY_MET
        - THEME_COVERAGE
        - REQUEST_DEFAULTS_APPLIED
        - DETERMINISTIC_TIE_BREAK_APPLIED
        - INSUFFICIENT_CANDIDATES
        - LOW_CONFIDENCE_METADATA_PRESENT
        - EXCLUDED_APPROVAL_GATE
        - EXCLUDED_MISSING_PROVENANCE
        - EXCLUDED_LICENSING_CONCERN
        - EXCLUDED_INACTIVE_ARRANGEMENT
        - EXCLUDED_DUPLICATE_ARRANGEMENT
        - EXCLUDED_KEY_CENTER_LIMIT
        - EXCLUDED_TEMPO_POLICY
        - EXCLUDED_WEAKER_SCORE
        - EXCLUDED_QUOTA_FILLED
