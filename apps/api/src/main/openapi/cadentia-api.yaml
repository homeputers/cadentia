      properties:
        id:
          type: string
          format: uuid
        candidateSongId:
          type: string
          format: uuid
        matchScore:
          type: number
          format: double
        matchSignalsJson:
          type: string
          nullable: true
        status:
          type: string
    AdminImportCandidateDetailResponse:
      type: object
      required: [candidateId, importBatchId, rawTitle, status, duplicateMatches, reviewHistory]
      properties:
        candidateId:
          type: string
          format: uuid
        importBatchId:
          type: string
          format: uuid
        rawTitle:
          type: string
        normalizedTitle:
          type: string
          nullable: true
        sourceArtistName:
          type: string
          nullable: true
        sourcePayloadJson:
          type: string
          nullable: true
        rawSourceReference:
          type: string
          nullable: true
        parserName:
          type: string
          nullable: true
        parserVersion:
          type: string
          nullable: true
        parserConfidence:
          type: string
          nullable: true
        parserWarnings:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/ImportCandidateStatus'
        duplicateMatches:
          type: array
          items:
            $ref: '#/components/schemas/AdminDuplicateMatch'
        reviewHistory:
          type: array
          items:
            $ref: '#/components/schemas/AdminReviewHistoryItem'
    AdminReviewHistoryItem:
      type: object
      required: [id, decision, reviewer, reviewedAt]
      properties:
        id:
          type: string
          format: uuid
        proposedDuplicateMatchId:
          type: string
          format: uuid
          nullable: true
        decision:
          type: string
        reviewer:
          type: string
        reviewNotes:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time

    ModerationFlagType:
      type: string
      enum: [BAD_SOURCE, LICENSING_CONCERN, INCORRECT_LYRICS, METADATA_CONFLICT, DOCTRINAL_CONCERN, PARSER_ISSUE]
    ModerationFlagStatus:
      type: string
      enum: [OPEN, ASSIGNED, RESOLVED, ESCALATED]
    OpenModerationFlagRequest:
      type: object
      additionalProperties: false
      required: [type, openedBy, reason, excludeFromRecommendation]
      properties:
        type:
