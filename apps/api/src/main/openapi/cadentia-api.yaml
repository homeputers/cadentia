        - $ref: '#/components/parameters/ServicePlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamServiceAssignmentRequest'
      responses:
        '201':
          description: Service assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamServiceAssignmentResponse'
  /team-assignments/services/{servicePlanId}/assignments/{assignmentId}:
    put:
      tags: [TeamAssignments]
      operationId: updateServiceTeamAssignment
      security:
        - bearerAuth: []
      x-required-roles: [WORSHIP_LEADER, TEAM_SCHEDULER, ADMIN]
