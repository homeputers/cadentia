      parameters:
        - $ref: '#/components/parameters/ServicePlanId'
        - $ref: '#/components/parameters/AssignmentId'
        - in: query
          name: reasonCode
          schema: { type: string, default: remove_assignment }
        - in: query
          name: reference
          schema: { type: string, nullable: true }
      responses:
        '204':
          description: Assignment removed from the active roster.
  /team-assignments/services/{servicePlanId}/assignments/{assignmentId}/substitute:
    post:
      tags: [TeamAssignments]
      operationId: substituteServiceTeamAssignment
      security:
        - bearerAuth: []
