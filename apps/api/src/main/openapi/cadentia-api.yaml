          items:
            type: string
        revisionHistory:
          type: array
          items:
            $ref: '#/components/schemas/ConversationRevisionEvent'
        expiresAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        auditMessages:
          type: array
          items:
            type: string
    ConversationSlotUpdateRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/SlotValueSource'
        slotPatch:
          type: object
          additionalProperties: false
          properties:
            verseText:
              type: string
            scriptureReferences:
              type: array
              items: { type: string }
            themeHints:
              type: array
              items: { type: string }
            counts:
              $ref: '#/components/schemas/SetlistCounts'
            keyPolicy:
              $ref: '#/components/schemas/KeyPolicy'
            tempoPolicy:
              $ref: '#/components/schemas/TempoPolicy'
            language:
              type: string
              nullable: true
            energyArc:
              type: string
              nullable: true
              enum: [steady, rising, falling, low_to_high, high_to_low]
            excludedSongs:
              type: array
              items: { type: string }
            serviceMoment:
              type: string
              nullable: true
              enum: [opening, communion, response, altar_call, sending, other]
    ConversationClarificationRequest:
      type: object
      additionalProperties: false
      required: [source, clarificationAnswer]
      properties:
        source:
          $ref: '#/components/schemas/SlotValueSource'
        clarificationAnswer:
          type: string
          minLength: 1
          maxLength: 5000
    ConversationConfirmRequest:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          enum: [true]
    ConversationRecoveryResponse:
      type: object
      additionalProperties: false
      required: [sessionId, priorState, recoveredState, recoveryMessage, restartSuggested]
      properties:
        sessionId:
          type: string
          format: uuid
        priorState:
          $ref: '#/components/schemas/ConversationState'
        recoveredState:
          $ref: '#/components/schemas/ConversationSessionStateResponse'
        recoveryMessage:
          type: string
        restartSuggested:
          type: boolean

    ImportCandidateStatus:
      type: string
      enum: [STAGED, DEDUPLICATION_REVIEW, READY_TO_MERGE, MERGED, REJECTED, FAILED]
    AdminImportCandidateQueueItem:
      type: object
      required: [candidateId, importBatchId, rawTitle, status, updatedAt]
      properties:
        candidateId:
          type: string
          format: uuid
        importBatchId:
          type: string
          format: uuid
        rawTitle:
          type: string
        normalizedTitle:
          type: string
          nullable: true
        sourceArtistName:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ImportCandidateStatus'
        updatedAt:
          type: string
          format: date-time
    AdminDuplicateMatch:
      type: object
