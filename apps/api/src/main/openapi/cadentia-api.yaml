openapi: 3.0.3
info:
  title: Cadentia API
  version: 0.1.0
  description: API-first contract for Cadentia setlist recommendation workflows.
servers:
- url: http://localhost:8080
  description: Local development server
tags:
- name: Setlists
  description: Deterministic setlist proposal operations
- name: AdminReview
  description: Admin import-governance review operations
- name: AdminOperations
  description: Admin session, diagnostics, configuration, feature-flag, and API-gap operations
- name: FeedbackTuning
  description: Recommendation feedback ingestion, inspection, and reset operations
- name: ServicePlans
  description: Service-plan composition, attachment, and publish operations
- name: TeamAssignments
  description: Worship team service, rehearsal, and musician assignment workflows
- name: RehearsalWorkflow
  description: Versioned rehearsal workflow, readiness, issue, note, and service-scoped
    override operations
- name: Assets
  description: Versioned media asset metadata, upload lifecycle, attachments, licensing, and signed access operations
- name: Plugins
  description: ADR-030 plugin registry, configuration, and lifecycle administration
- name: Telegram
  description: Telegram webhook intake, channel-session, account-linking, and bot management operations
