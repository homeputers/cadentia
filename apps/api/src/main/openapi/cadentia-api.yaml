    ResolveModerationFlagRequest:
      type: object
      additionalProperties: false
      required: [actor, resolutionNotes]
      properties:
        actor:
          type: string
        resolutionNotes:
          type: string
    EscalateModerationFlagRequest:
      type: object
      additionalProperties: false
      required: [actor, reason]
