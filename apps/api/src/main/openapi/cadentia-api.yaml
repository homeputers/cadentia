openapi: 3.0.3
info:
  title: Cadentia API
  version: 0.1.0
  description: API-first contract for Cadentia setlist recommendation workflows.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Setlists
    description: Deterministic setlist proposal operations
  - name: AdminReview
    description: Admin import-governance review operations
  - name: FeedbackTuning
    description: Recommendation feedback ingestion, inspection, and reset operations
  - name: ServicePlans
    description: Service-plan composition, attachment, and publish operations
  - name: TeamAssignments
    description: Worship team service, rehearsal, and musician assignment workflows
paths:
  /feedback/events:
    post:
      tags:
        - FeedbackTuning
      operationId: recordFeedbackEvent
      security:
        - bearerAuth: []
      x-required-roles: # recordFeedbackEvent
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Record explicit recommendation feedback for deterministic tuning
      description: >
        Persists explicit user feedback signals that influence ranking weights only.
        Feedback never changes eligibility gates such as approval, provenance, activity, or licensing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackEventRequest'
      responses:
        '201':
          description: Feedback event recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEventResponse'
    get:
      tags:
        - FeedbackTuning
      operationId: listFeedbackEvents
      security:
        - bearerAuth: []
      x-required-roles: # listFeedbackEvents
        - CATALOG_EDITOR
        - ADMIN
      summary: List feedback events for inspection and governance
      description: >
        Returns append-only feedback events by scope for audit and tuning analysis.
        Listing requires authenticated operational roles (for example TEAM_LEAD or ADMIN).
      parameters:
        - in: query
          name: scopeLayer
          schema:
            $ref: '#/components/schemas/FeedbackScopeLayer'
        - in: query
          name: scopeId
          schema:
            type: string
            format: uuid
        - in: query
          name: arrangementId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Feedback events matching filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackEventResponse'
  /feedback/scopes/{scopeLayer}/{scopeId}/state:
    get:
      tags:
        - FeedbackTuning
      operationId: getFeedbackScopeState
      security:
        - bearerAuth: []
      x-required-roles: # getFeedbackScopeState
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - ADMIN
      summary: Inspect deterministic feedback aggregate state for a scope
      description: >
        Returns aggregate counters and last-updated markers used by recommendation tuning.
        Scope resolution order is personal -> team -> policy/global fallback.
      parameters:
        - in: path
          name: scopeLayer
          required: true
          schema:
            $ref: '#/components/schemas/FeedbackScopeLayer'
        - in: path
          name: scopeId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aggregated feedback state for the requested scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackScopeStateResponse'
  /feedback/scopes/{scopeLayer}/{scopeId}/reset:
    post:
      tags:
        - FeedbackTuning
      operationId: resetFeedbackScopeState
      security:
        - bearerAuth: []
      x-required-roles: # resetFeedbackScopeState
        - ADMIN
      summary: Reset feedback state for a scope
      description: >
        Destructive governance operation that resets feedback influence state for a scope.
        This endpoint must be restricted to elevated roles (for example TEAM_LEAD or ADMIN).
      parameters:
        - in: path
          name: scopeLayer
          required: true
          schema:
            $ref: '#/components/schemas/FeedbackScopeLayer'
        - in: path
          name: scopeId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackResetRequest'
      responses:
        '200':
          description: Feedback scope reset was accepted and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResetResponse'
  /api/admin/import-candidates:
    get:
      tags:
        - AdminReview
      operationId: listAdminImportCandidates
      security:
        - bearerAuth: []
      x-required-roles: # listAdminImportCandidates
        - CATALOG_EDITOR
        - ADMIN
      summary: List import candidates for admin triage queue
      parameters:
        - in: query
          name: batchId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ImportCandidateStatus'
      responses:
        '200':
          description: Candidate queue page.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminImportCandidateQueueItem'
  /api/admin/import-candidates/{candidateId}:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateDetail
      security:
        - bearerAuth: []
      x-required-roles: # getAdminImportCandidateDetail
        - CATALOG_EDITOR
        - ADMIN
      summary: Fetch admin candidate detail with parser evidence
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Candidate detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportCandidateDetailResponse'
        '404':
          description: Candidate not found.
  /api/admin/import-candidates/{candidateId}/duplicates:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateDuplicates
      security:
        - bearerAuth: []
      x-required-roles: # getAdminImportCandidateDuplicates
        - CATALOG_EDITOR
        - ADMIN
      summary: Fetch ranked duplicate matches for a candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicate matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDuplicateMatch'

  /api/admin/import-candidates/{candidateId}/audit-history:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateAuditHistory
      security:
        - bearerAuth: []
      x-required-roles: # getAdminImportCandidateAuditHistory
        - CATALOG_EDITOR
        - ADMIN
      summary: Fetch append-only audit history for an import candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit history entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAuditHistoryItem'
  /api/admin/import-candidates/{candidateId}/moderation-flags:
    post:
      tags:
        - AdminReview
      operationId: openAdminModerationFlag
      security:
        - bearerAuth: []
      x-required-roles: # openAdminModerationFlag
        - CATALOG_EDITOR
        - ADMIN
      summary: Open a moderation flag for an import candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenModerationFlagRequest'
      responses:
        '200':
          description: Created moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/assign:
    post:
      tags:
        - AdminReview
      operationId: assignAdminModerationFlag
      security:
        - bearerAuth: []
      x-required-roles: # assignAdminModerationFlag
        - CATALOG_EDITOR
        - ADMIN
      summary: Assign a moderation flag to a reviewer
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/resolve:
    post:
      tags:
        - AdminReview
      operationId: resolveAdminModerationFlag
      security:
        - bearerAuth: []
      x-required-roles: # resolveAdminModerationFlag
        - CATALOG_EDITOR
        - ADMIN
      summary: Resolve a moderation flag
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/escalate:
    post:
      tags:
        - AdminReview
      operationId: escalateAdminModerationFlag
      security:
        - bearerAuth: []
      x-required-roles: # escalateAdminModerationFlag
        - CATALOG_EDITOR
        - ADMIN
      summary: Escalate a moderation flag
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'

  /api/admin/rollback-previews:
    post:
      tags:
        - AdminReview
      operationId: createAdminRollbackPreview
      security:
        - bearerAuth: []
      x-required-roles: # createAdminRollbackPreview
        - ADMIN
      summary: Create rollback preview for a target entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRollbackPreviewRequest'
      responses:
        '200':
          description: Rollback preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackPreviewResponse'
  /api/admin/rollbacks:
    post:
      tags:
        - AdminReview
      operationId: executeAdminRollback
      security:
        - bearerAuth: []
      x-required-roles: # executeAdminRollback
        - ADMIN
      summary: Execute a previously previewed rollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRollbackRequest'
      responses:
        '200':
          description: Rollback execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackExecutionResponse'
  /conversation-sessions/{sessionId}:
    get:
      tags:
        - Setlists
      operationId: getConversationSessionState
      security:
        - bearerAuth: []
      x-required-roles: # getConversationSessionState
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Read current conversation session state
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session state snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'
        '404':
          description: Session not found.

  /conversation-sessions/{sessionId}/slots:
    patch:
      tags:
        - Setlists
      operationId: updateConversationSessionSlots
      security:
        - bearerAuth: []
      x-required-roles: # updateConversationSessionSlots
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Merge slot updates into conversation session state
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSlotUpdateRequest'
      responses:
        '200':
          description: Updated state snapshot after deterministic merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'
        '409':
          description: Conflict or invalid state transition.

  /conversation-sessions/{sessionId}/clarify:
    post:
      tags:
        - Setlists
      operationId: requestConversationClarification
      security:
        - bearerAuth: []
      x-required-roles: # requestConversationClarification
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Submit clarification answer and return updated state
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationClarificationRequest'
      responses:
        '200':
          description: Updated session state after clarification merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'

  /conversation-sessions/{sessionId}/confirm:
    post:
      tags:
        - Setlists
      operationId: confirmConversationSession
      security:
        - bearerAuth: []
      x-required-roles: # confirmConversationSession
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Confirm normalized request and transition to CONFIRMED
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationConfirmRequest'
      responses:
        '200':
          description: Confirmed session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'
        '409':
          description: Session not ready to confirm.

  /conversation-sessions/{sessionId}/cancel:
    post:
      tags:
        - Setlists
      operationId: cancelConversationSession
      security:
        - bearerAuth: []
      x-required-roles: # cancelConversationSession
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Cancel active session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionStateResponse'

  /conversation-sessions/{sessionId}/recover:
    post:
      tags:
        - Setlists
      operationId: recoverConversationSession
      security:
        - bearerAuth: []
      x-required-roles: # recoverConversationSession
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Recover from an expired session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recovery options and a restarted or resumed state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRecoveryResponse'

  /setlists/proposals/natural-language:
    post:
      tags:
        - Setlists
      operationId: generateSetlistProposalFromNaturalLanguage
      security:
        - bearerAuth: []
      x-required-roles: # generateSetlistProposalFromNaturalLanguage
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Generate a setlist proposal from natural-language text
      description: >-
        Accepts raw user text, invokes the LLM intent boundary, validates the
        resulting contract payload, applies backend defaults, and invokes
        recommendation only for valid GENERATE_SETLIST intents. Recommendations are
        sourced from approved and active catalog content only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalLanguageSetlistRequest'
      responses:
        '202':
          description: Setlist proposal accepted, clarification requested, or safely rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistProposalResponse'
        '400':
          description: Request validation failed.
  /setlists/proposals:
    post:
      tags:
        - Setlists
      operationId: generateSetlistProposal
      summary: Generate a setlist proposal from structured intent slots
      description: >-
        Accepts structured slots produced by the intent parser. Song selection remains
        backend-only and must use approved and active catalog data only. When an explanation
        payload is included, every explanation fact is generated by the deterministic
        Recommendation Engine from scoring, policy, and catalog evidence; clients must not
        treat LLM prose or client-provided rationale as explanation source-of-truth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSetlistRequest'
      responses:
        '202':
          description: Setlist proposal accepted or safely deferred until catalog support is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistProposalResponse'
        '400':
          description: Request validation failed.
  /setlists:
    post:
      tags:
        - Setlists
      operationId: createSetlistBaselineVersion
      security:
        - bearerAuth: []
      x-required-roles: # createSetlistBaselineVersion
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Persist a generated setlist baseline as version 1
      description: >-
        Stores the deterministic recommendation output and immutable generation context.
        The resulting resource is identified by a logical setlist_id and immutable version_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetlistBaselineRequest'
      responses:
        '201':
          description: Baseline version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionEnvelope'
        '400':
          description: Request validation failed.
  /setlists/{setlistId}/edits:
    post:
      tags:
        - Setlists
      operationId: commitSetlistEdits
      security:
        - bearerAuth: []
      x-required-roles: # commitSetlistEdits
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Commit auditable edit operations as a new immutable version
      parameters:
        - in: path
          name: setlistId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitSetlistEditsRequest'
      responses:
        '201':
          description: Edit operations committed and a new immutable version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionEnvelope'
        '404':
          description: Setlist or base version does not exist.
        '409':
          description: Base version is locked or is not the latest permitted editable ancestor.
  /setlists/{setlistId}/versions:
    get:
      tags:
        - Setlists
      operationId: listSetlistVersions
      security:
        - bearerAuth: []
      x-required-roles: # listSetlistVersions
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: List immutable versions for a setlist lineage
      description: >
        User-facing results include only songs and arrangements that are approved and active at read time.
      parameters:
        - in: path
          name: setlistId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordered version lineage metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionListResponse'
        '404':
          description: Setlist not found.
  /setlists/{setlistId}/versions/{versionId}:
    get:
      tags:
        - Setlists
      operationId: getSetlistVersion
      security:
        - bearerAuth: []
      x-required-roles: # getSetlistVersion
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Retrieve a specific immutable setlist version snapshot
      description: >
        User-facing results include only songs and arrangements that are approved and active at read time.
      parameters:
        - in: path
          name: setlistId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: versionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Immutable snapshot and provenance details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionEnvelope'
        '404':
          description: Setlist or version not found.
  /setlists/{setlistId}/versions/{fromVersionId}/diff/{toVersionId}:
    get:
      tags:
        - Setlists
      operationId: diffSetlistVersions
      security:
        - bearerAuth: []
      x-required-roles: # diffSetlistVersions
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Compare two immutable versions in the same setlist lineage
      parameters:
        - in: path
          name: setlistId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: fromVersionId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: toVersionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deterministic structural and attribute diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistVersionDiffResponse'
        '404':
          description: Setlist or requested versions not found.
  /service-plans:
    post:
      tags:
        - ServicePlans
      operationId: createServicePlan
      security:
        - bearerAuth: []
      x-required-roles: # createServicePlan
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Create a draft service plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServicePlanRequest'
      responses:
        '201':
          description: Draft service plan created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanResponse'
    get:
      tags:
        - ServicePlans
      operationId: listServicePlans
      security:
        - bearerAuth: []
      x-required-roles: # listServicePlans
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: List service plans
      description: >
        User-facing plan payloads only expose approved and active song content in attached setlist references.
      responses:
        '200':
          description: Service plans matching filter criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePlanSummary'

  /service-plans/{servicePlanId}:
    get:
      tags:
        - ServicePlans
      operationId: getServicePlan
      security:
        - bearerAuth: []
      x-required-roles: # getServicePlan
        - WORSHIP_LEADER
        - CATALOG_EDITOR
        - DOCTRINAL_REVIEWER
        - MUSICAL_REVIEWER
        - ADMIN
      summary: Retrieve a service plan
      description: >
        User-facing plan payloads only expose approved and active song content in attached setlist references.
      parameters:
        - in: path
          name: servicePlanId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service plan detail.
          content:
            application/json:
              schema:
