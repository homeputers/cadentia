openapi: 3.0.3
info:
  title: Cadentia API
  version: 0.1.0
  description: API-first contract for Cadentia setlist recommendation workflows.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Setlists
    description: Deterministic setlist proposal operations
  - name: AdminReview
    description: Admin import-governance review operations
paths:
  /api/admin/import-candidates:
    get:
      tags:
        - AdminReview
      operationId: listAdminImportCandidates
      summary: List import candidates for admin triage queue
      parameters:
        - in: query
          name: batchId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ImportCandidateStatus'
      responses:
        '200':
          description: Candidate queue page.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminImportCandidateQueueItem'
  /api/admin/import-candidates/{candidateId}:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateDetail
      summary: Fetch admin candidate detail with parser evidence
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Candidate detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportCandidateDetailResponse'
        '404':
          description: Candidate not found.
  /api/admin/import-candidates/{candidateId}/duplicates:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateDuplicates
      summary: Fetch ranked duplicate matches for a candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicate matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDuplicateMatch'

  /api/admin/import-candidates/{candidateId}/audit-history:
    get:
      tags:
        - AdminReview
      operationId: getAdminImportCandidateAuditHistory
      summary: Fetch append-only audit history for an import candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit history entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAuditHistoryItem'
  /api/admin/import-candidates/{candidateId}/moderation-flags:
    post:
      tags:
        - AdminReview
      operationId: openAdminModerationFlag
      summary: Open a moderation flag for an import candidate
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenModerationFlagRequest'
      responses:
        '200':
          description: Created moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/assign:
    post:
      tags:
        - AdminReview
      operationId: assignAdminModerationFlag
      summary: Assign a moderation flag to a reviewer
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/resolve:
    post:
      tags:
        - AdminReview
      operationId: resolveAdminModerationFlag
      summary: Resolve a moderation flag
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'
  /api/admin/moderation-flags/{flagId}/escalate:
    post:
      tags:
        - AdminReview
      operationId: escalateAdminModerationFlag
      summary: Escalate a moderation flag
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateModerationFlagRequest'
      responses:
        '200':
          description: Updated moderation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationFlagResponse'

  /api/admin/rollback-previews:
    post:
      tags:
        - AdminReview
      operationId: createAdminRollbackPreview
      summary: Create rollback preview for a target entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRollbackPreviewRequest'
      responses:
        '200':
          description: Rollback preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackPreviewResponse'
  /api/admin/rollbacks:
    post:
      tags:
        - AdminReview
      operationId: executeAdminRollback
      summary: Execute a previously previewed rollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRollbackRequest'
      responses:
        '200':
          description: Rollback execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackExecutionResponse'

  /setlists/proposals/natural-language:
    post:
      tags:
        - Setlists
      operationId: generateSetlistProposalFromNaturalLanguage
      summary: Generate a setlist proposal from natural-language text
      description: >-
        Accepts raw user text, invokes the LLM intent boundary, validates the
        resulting contract payload, applies backend defaults, and invokes
        recommendation only for valid GENERATE_SETLIST intents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalLanguageSetlistRequest'
      responses:
        '202':
          description: Setlist proposal accepted, clarification requested, or safely rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistProposalResponse'
        '400':
          description: Request validation failed.
  /setlists/proposals:
    post:
      tags:
        - Setlists
      operationId: generateSetlistProposal
      summary: Generate a setlist proposal from structured intent slots
      description: >-
        Accepts structured slots produced by the intent parser. Song selection remains
        backend-only and must use approved catalog data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSetlistRequest'
      responses:
        '202':
          description: Setlist proposal accepted or safely deferred until catalog support is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlistProposalResponse'
        '400':
          description: Request validation failed.
components:
  schemas:
    NaturalLanguageSetlistRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: Raw natural-language user request to extract into the intent contract.
          example: Build a thanksgiving set around Psalm 100 with 4 praise songs and 2 worship songs.
    GenerateSetlistRequest:
      type: object
      additionalProperties: false
      required:
        - verseText
        - counts
        - keyPolicy
        - tempoPolicy
      properties:
        verseText:
          type: string
          minLength: 1
          description: Scripture text or reference that frames the setlist.
          example: Psalm 100
        scriptureReferences:
          type: array
          description: Optional normalized scripture references explicitly provided or confidently extracted.
          items:
            type: string
          default: []
          example:
            - Psalm 100
        themeHints:
          type: array
          description: Optional controlled or free-form theme hints extracted from the user prompt.
          items:
            type: string
          default: []
          example:
            - thanksgiving
        counts:
          $ref: '#/components/schemas/SetlistCounts'
        keyPolicy:
          $ref: '#/components/schemas/KeyPolicy'
        tempoPolicy:
          $ref: '#/components/schemas/TempoPolicy'
        language:
          type: string
          nullable: true
          description: Requested language when supplied by the user.
          example: Spanish
        energyArc:
          type: string
          nullable: true
          enum:
            - steady
            - rising
            - falling
            - low_to_high
            - high_to_low
          description: Requested energy shape when supplied by the user.
        excludedSongs:
          type: array
          description: User-provided exclusions by title or catalog reference; never selected by the LLM.
          items:
            type: string
          default: []
          example:
            - Example Song To Avoid
        serviceMoment:
          type: string
          nullable: true
          enum:
            - opening
            - communion
            - response
            - altar_call
            - sending
            - other
          description: Controlled service moment when supplied by the user.
    SetlistCounts:
      type: object
      additionalProperties: false
      required:
        - praise
        - worship
      properties:
        praise:
          type: integer
          format: int32
          minimum: 0
          maximum: 25
          default: 10
        worship:
          type: integer
          format: int32
          minimum: 0
          maximum: 25
          default: 5
    KeyPolicy:
      type: object
      additionalProperties: false
      required:
        - preferSameKey
        - allowRelativeMajorMinor
        - maxKeyCenters
      properties:
        preferSameKey:
          type: boolean
          default: true
        allowRelativeMajorMinor:
          type: boolean
          default: true
        maxKeyCenters:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          default: 2
    TempoPolicy:
      type: object
      additionalProperties: false
      required:
        - maxJumpBpm
      properties:
        maxJumpBpm:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 12
    SetlistProposalResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - auditMessages
      properties:
        status:
          type: string
          description: Machine-readable proposal status.
          example: PENDING_CATALOG_IMPLEMENTATION
        auditMessages:
          type: array
          description: Transparent safety and processing messages for the proposal.
          items:
            type: string
          example:
            - Recommendation Engine scaffold accepted the structured request.
            - No songs were selected because catalog retrieval is not implemented yet.
    ImportCandidateStatus:
      type: string
      enum: [STAGED, DEDUPLICATION_REVIEW, READY_TO_MERGE, MERGED, REJECTED, FAILED]
    AdminImportCandidateQueueItem:
      type: object
      required: [candidateId, importBatchId, rawTitle, status, updatedAt]
      properties:
        candidateId:
          type: string
          format: uuid
        importBatchId:
          type: string
          format: uuid
        rawTitle:
          type: string
        normalizedTitle:
          type: string
          nullable: true
        sourceArtistName:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ImportCandidateStatus'
        updatedAt:
          type: string
          format: date-time
    AdminDuplicateMatch:
      type: object
      required: [id, candidateSongId, matchScore, status]
      properties:
        id:
          type: string
          format: uuid
        candidateSongId:
          type: string
          format: uuid
        matchScore:
          type: number
          format: double
        matchSignalsJson:
          type: string
          nullable: true
        status:
          type: string
    AdminImportCandidateDetailResponse:
      type: object
      required: [candidateId, importBatchId, rawTitle, status, duplicateMatches, reviewHistory]
      properties:
        candidateId:
          type: string
          format: uuid
        importBatchId:
          type: string
          format: uuid
        rawTitle:
          type: string
        normalizedTitle:
          type: string
          nullable: true
        sourceArtistName:
          type: string
          nullable: true
        sourcePayloadJson:
          type: string
          nullable: true
        rawSourceReference:
          type: string
          nullable: true
        parserName:
          type: string
          nullable: true
        parserVersion:
          type: string
          nullable: true
        parserConfidence:
          type: string
          nullable: true
        parserWarnings:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/ImportCandidateStatus'
        duplicateMatches:
          type: array
          items:
            $ref: '#/components/schemas/AdminDuplicateMatch'
        reviewHistory:
          type: array
          items:
            $ref: '#/components/schemas/AdminReviewHistoryItem'
    AdminReviewHistoryItem:
      type: object
      required: [id, decision, reviewer, reviewedAt]
      properties:
        id:
          type: string
          format: uuid
        proposedDuplicateMatchId:
          type: string
          format: uuid
          nullable: true
        decision:
          type: string
        reviewer:
          type: string
        reviewNotes:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time

    ModerationFlagType:
      type: string
      enum: [BAD_SOURCE, LICENSING_CONCERN, INCORRECT_LYRICS, METADATA_CONFLICT, DOCTRINAL_CONCERN, PARSER_ISSUE]
    ModerationFlagStatus:
      type: string
      enum: [OPEN, ASSIGNED, RESOLVED, ESCALATED]
    OpenModerationFlagRequest:
      type: object
      additionalProperties: false
      required: [type, openedBy, reason, excludeFromRecommendation]
      properties:
        type:
          $ref: '#/components/schemas/ModerationFlagType'
        openedBy:
          type: string
        reason:
          type: string
        excludeFromRecommendation:
          type: boolean
    AssignModerationFlagRequest:
      type: object
      additionalProperties: false
      required: [assignedTo, actor, reason]
      properties:
        assignedTo:
          type: string
        actor:
          type: string
        reason:
          type: string
    ResolveModerationFlagRequest:
      type: object
      additionalProperties: false
      required: [actor, resolutionNotes]
      properties:
        actor:
          type: string
        resolutionNotes:
          type: string
    EscalateModerationFlagRequest:
      type: object
      additionalProperties: false
      required: [actor, reason]
      properties:
        actor:
          type: string
        reason:
          type: string
    ModerationFlagResponse:
      type: object
      required: [id, importCandidateId, type, status, openedBy, excludeFromRecommendation, openedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        importCandidateId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ModerationFlagType'
        status:
          $ref: '#/components/schemas/ModerationFlagStatus'
        openedBy:
          type: string
        assignedTo:
          type: string
          nullable: true
        resolutionNotes:
          type: string
          nullable: true
        excludeFromRecommendation:
          type: boolean
        openedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RollbackTargetType:
      type: string
      enum: [IMPORT_CANDIDATE, APPROVAL, MODERATION_FLAG]
    CreateRollbackPreviewRequest:
      type: object
      required: [targetType, targetId, actor]
      properties:
        targetType:
          $ref: '#/components/schemas/RollbackTargetType'
        targetId:
          type: string
          format: uuid
        actor:
          type: string
        importBatchId:
          type: string
          format: uuid
    RollbackImpactedRecord:
      type: object
      properties:
        entityType:
          type: string
        entityId:
          type: string
        status:
          type: string
    RollbackPreviewResponse:
      type: object
      properties:
        rollbackRequestId:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/RollbackTargetType'
        targetId:
          type: string
          format: uuid
        importBatchId:
          type: string
          format: uuid
        eligibilityImpacted:
          type: boolean
        impactedRecords:
          type: array
          items:
            $ref: '#/components/schemas/RollbackImpactedRecord'
        blockers:
          type: array
          items:
            type: string
    ExecuteRollbackRequest:
      type: object
      required: [rollbackRequestId, actor]
      properties:
        rollbackRequestId:
          type: string
          format: uuid
        actor:
          type: string
        reason:
          type: string
    RollbackExecutionResponse:
      type: object
      properties:
        rollbackRequestId:
          type: string
          format: uuid
        action:
          type: string
        auditEventId:
          type: string
          format: uuid

    AdminAuditHistoryItem:
      type: object
      required: [id, entityId, entityType, action, actor, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        entityType:
          type: string
        action:
          type: string
        actor:
          type: string
        occurredAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        beforeState:
          type: object
          nullable: true
          additionalProperties: true
        afterState:
          type: object
          nullable: true
          additionalProperties: true
