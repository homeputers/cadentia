ReadinessHistoryResponse:
  type: object
  required:
  - previousStateCode
  - newStateCode
  - changedBy
  - changedAt
  properties:
    previousStateCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalReadinessStateCode"
      nullable: true
    newStateCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalReadinessStateCode"
    changedBy:
      type: string
    changedAt:
      type: string
      format: date-time
    reason:
      type: string
      nullable: true
ServicePlanStatus:
  type: string
  enum:
  - draft
  - published
  - finalized
ServicePlanBlockType:
  type: string
  enum:
  - praise
  - worship
  - offering
  - altar_call
  - communion
  - special
ServicePlanBlockSourceType:
  type: string
  enum:
  - setlist_version
  - manual
ServicePlanSummary:
  type: object
  required:
  - servicePlanId
  - title
  - serviceDateTime
  - status
  properties:
    servicePlanId:
      type: string
      format: uuid
    title:
      type: string
    serviceDateTime:
      type: string
      format: date-time
    status:
      "$ref": "#/ServicePlanStatus"
CreateServicePlanRequest:
  type: object
  additionalProperties: false
  required:
  - serviceDateTime
  - title
  properties:
    serviceDateTime:
      type: string
      format: date-time
    title:
      type: string
      minLength: 1
      maxLength: 160
    theme:
      type: string
      nullable: true
    scripture:
      type: string
      nullable: true
    notes:
      type: string
      nullable: true
UpdateServicePlanRequest:
  allOf:
  - "$ref": "#/CreateServicePlanRequest"
AttachSetlistVersionRequest:
  type: object
  additionalProperties: false
  required:
  - setlistId
  - setlistVersionId
  properties:
    setlistId:
      type: string
      format: uuid
    setlistVersionId:
      type: string
      format: uuid
    placementIndex:
      type: integer
      minimum: 0
      nullable: true
    notes:
      type: string
      nullable: true
ServicePlanSetlistAttachmentResponse:
  type: object
  required:
  - attachmentId
  - servicePlanId
  - setlistId
  - setlistVersionId
  properties:
    attachmentId:
      type: string
      format: uuid
    servicePlanId:
      type: string
      format: uuid
    setlistId:
      type: string
      format: uuid
    setlistVersionId:
      type: string
      format: uuid
    attachedAt:
      type: string
      format: date-time
ServicePlanBlockProvenance:
  type: object
  properties:
    sourceType:
      "$ref": "#/ServicePlanBlockSourceType"
    setlistId:
      type: string
      format: uuid
      nullable: true
    setlistVersionId:
      type: string
      format: uuid
      nullable: true
    setlistEntryId:
      type: string
      format: uuid
      nullable: true
ServicePlanBlock:
  type: object
  required:
  - blockId
  - orderIndex
  - type
  - title
  - provenance
  properties:
    blockId:
      type: string
      format: uuid
    orderIndex:
      type: integer
      minimum: 0
    type:
      "$ref": "#/ServicePlanBlockType"
    title:
      type: string
    notes:
      type: string
      nullable: true
    serviceTransposeSemitones:
      type: integer
      nullable: true
    serviceKeyOverride:
      type: string
      nullable: true
    provenance:
      "$ref": "#/ServicePlanBlockProvenance"
    workflowIssues:
      type: array
      description: Open song-level rehearsal issues and action owner/status indicators for this block in the selected service context. Private note/action details are redacted in public modes.
      items:
        "$ref": "#/WorkflowIssueIndicator"
      default: []
ReorderServicePlanBlocksRequest:
  type: object
  additionalProperties: false
  required:
  - orderedBlockIds
  properties:
    orderedBlockIds:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
ServicePlanEffectiveSequenceSnapshot:
  type: object
  required:
  - snapshotId
  - capturedAt
  - blocks
  properties:
    snapshotId:
      type: string
      format: uuid
    capturedAt:
      type: string
      format: date-time
    blocks:
      type: array
      items:
        "$ref": "#/ServicePlanBlock"
ServicePlanResponse:
  type: object
  required:
  - servicePlanId
  - serviceDateTime
  - title
  - status
  - blocks
  - setlistAttachments
  properties:
    servicePlanId:
      type: string
      format: uuid
    serviceDateTime:
      type: string
      format: date-time
    title:
      type: string
    theme:
      type: string
      nullable: true
    scripture:
      type: string
      nullable: true
    notes:
      type: string
      nullable: true
    status:
      "$ref": "#/ServicePlanStatus"
    blocks:
      type: array
      items:
        "$ref": "#/ServicePlanBlock"
    setlistAttachments:
      type: array
      items:
        "$ref": "#/ServicePlanSetlistAttachmentResponse"
    effectiveSequenceSnapshot:
      "$ref": "#/ServicePlanEffectiveSequenceSnapshot"
      nullable: true
    readinessSummary:
      "$ref": "#/ReadinessSummary"
      nullable: true
    workflowSummary:
      "$ref": "#/WorkflowOperationalSummary"
      nullable: true
      description: Service-scoped rehearsal workflow summary. This is operational context and never catalog approval or recommendation scoring evidence.
WorkflowSummarySession:
  type: object
  required:
  - rehearsalSessionId
  - sessionCode
  - startsAt
  - endsAt
  - readinessStateCode
  properties:
    rehearsalSessionId:
      type: string
      format: uuid
    sessionCode:
      type: string
    startsAt:
      type: string
      format: date-time
    endsAt:
      type: string
      format: date-time
    location:
      type: string
      nullable: true
    readinessStateCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalReadinessStateCode"
WorkflowIssueCount:
  type: object
  required:
  - categoryCode
  - severityCode
  - count
  properties:
    categoryCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalIssueCategoryCode"
    severityCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalIssueSeverityCode"
    count:
      type: integer
      minimum: 0
WorkflowIssueActionIndicator:
  type: object
  required:
  - actionId
  - actionStatusCode
  - ownerType
  - open
  properties:
    actionId:
      type: string
      format: uuid
    actionStatusCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalIssueActionStatusCode"
    actionSummary:
      type: string
      nullable: true
      description: Redacted from public/unauthorized modes.
    ownerType:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalIssueOwnerType"
    ownerActor:
      type: string
      nullable: true
      description: Restricted personnel identifier; redacted outside authorized modes.
    ownerTeamRoleCode:
      type: string
      nullable: true
    ownerServiceAssignmentId:
      type: string
      format: uuid
      nullable: true
      description: Restricted personnel assignment reference; redacted outside authorized modes.
    completedAt:
      type: string
      format: date-time
      nullable: true
    open:
      type: boolean
WorkflowIssueIndicator:
  type: object
  required:
  - issueId
  - target
  - categoryCode
  - severityCode
  - statusCode
  - blocking
  - title
  - actions
  properties:
    issueId:
      type: string
      format: uuid
    target:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalWorkflowTarget"
    categoryCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalIssueCategoryCode"
    severityCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalIssueSeverityCode"
    statusCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalIssueStatusCode"
    blocking:
      type: boolean
    title:
      type: string
    detail:
      type: string
      nullable: true
      description: Private issue detail; redacted from public/unauthorized modes.
    detectedBy:
      type: string
      nullable: true
      description: Restricted personnel identifier; redacted outside authorized modes.
    actions:
      type: array
      items:
        "$ref": "#/WorkflowIssueActionIndicator"
WorkflowOperationalSummary:
  type: object
  required:
  - servicePlanId
  - explicitStateCode
  - derivedStateCode
  - readyForService
  - currentPhase
  - rehearsalSessions
  - blockerCount
  - overdueActionCount
  - openIssueCounts
  - unresolvedTransitionIssueCount
  - difficultSongIssueCount
  - serviceSpecificOverrideCount
  - hasServiceSpecificOverrides
  - openIssues
  - redacted
  properties:
    servicePlanId:
      type: string
      format: uuid
    explicitStateCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalReadinessStateCode"
    derivedStateCode:
      "$ref": "./rehearsal-workflow.yaml#/RehearsalReadinessStateCode"
    readyForService:
      type: boolean
    currentPhase:
      type: string
      enum:
      - planning
      - planned
      - rehearsal_active
      - issues_open
      - ready_for_service
      - completed
    nextRehearsalSession:
      "$ref": "#/WorkflowSummarySession"
      nullable: true
    mostRecentPastRehearsalSession:
      "$ref": "#/WorkflowSummarySession"
      nullable: true
    rehearsalSessions:
      type: array
      items:
        "$ref": "#/WorkflowSummarySession"
    blockerCount:
      type: integer
      minimum: 0
    overdueActionCount:
      type: integer
      minimum: 0
      description: Open required action count surfaced as overdue/actionable workflow work until explicit due dates are modeled.
    openIssueCounts:
      type: array
      items:
        "$ref": "#/WorkflowIssueCount"
    unresolvedTransitionIssueCount:
      type: integer
      minimum: 0
    difficultSongIssueCount:
      type: integer
      minimum: 0
    serviceSpecificOverrideCount:
      type: integer
      minimum: 0
    hasServiceSpecificOverrides:
      type: boolean
      description: Service-specific override indicator; never an approved catalog fact.
    openIssues:
      type: array
      items:
        "$ref": "#/WorkflowIssueIndicator"
    redacted:
      type: boolean
      description: True when private note content or restricted personnel details are omitted.
ReadinessStatus:
  type: string
  enum:
  - UNKNOWN
  - READY
  - AT_RISK
  - BLOCKED
ReadinessSummary:
  type: object
  required:
  - status
  - objectiveBlockers
  - missingPeople
  - unresolvedArrangementConflicts
  - privateNoteCount
  properties:
    status:
      "$ref": "#/ReadinessStatus"
    objectiveBlockers:
      type: array
      items:
        type: string
    missingPeople:
      type: array
      items:
        type: string
    unresolvedArrangementConflicts:
      type: array
      items:
        type: string
    privateNoteCount:
      type: integer
      minimum: 0
    lastUpdatedAt:
      type: string
      format: date-time
      nullable: true
PublishServicePlanRequest:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 0
      nullable: true
    publishNote:
      type: string
      nullable: true
ServicePlanPublishResponse:
  allOf:
  - "$ref": "#/ServicePlanResponse"
  - type: object
    required:
    - publishedAt
    - publishedBy
    properties:
      publishedAt:
        type: string
        format: date-time
      publishedBy:
        type: string
