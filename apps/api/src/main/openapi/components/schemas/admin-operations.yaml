AdminCapability:
  type: string
  enum:
  - VIEW_IMPORT_QUEUE
  - REVIEW_CATALOG
  - MANAGE_MODERATION
  - PREVIEW_ROLLBACK
  - EXECUTE_ROLLBACK
  - VIEW_AUDIT
  - VIEW_DIAGNOSTICS
  - MANAGE_INSTANCE_CONFIGURATION
  - MANAGE_FEATURE_FLAGS
  - MANAGE_BOT_CHANNELS
AdminAllowedAction:
  type: string
  enum:
  - VIEW
  - CREATE
  - UPDATE
  - PREVIEW
  - CONFIRM
  - ASSIGN
  - RESOLVE
  - ESCALATE
  - ROLLBACK
AdminAuditReference:
  type: object
  required:
  - auditEventId
  - occurredAt
  properties:
    auditEventId:
      type: string
      format: uuid
    occurredAt:
      type: string
      format: date-time
    actorId:
      type: string
    reason:
      type: string
      nullable: true
AdminOptimisticConcurrency:
  type: object
  required:
  - version
  - etag
  properties:
    version:
      type: integer
      format: int64
    etag:
      type: string
AdminSessionResponse:
  type: object
  required:
  - actorId
  - displayName
  - churchInstanceId
  - roles
  - capabilities
  properties:
    actorId:
      type: string
    displayName:
      type: string
    churchInstanceId:
      type: string
    roles:
      type: array
      items:
        type: string
    capabilities:
      type: array
      items:
        "$ref": "#/AdminCapability"
AdminDiagnosticStatus:
  type: string
  enum:
  - OK
  - DEGRADED
  - UNAVAILABLE
  - UNKNOWN
AdminDiagnosticsComponent:
  type: object
  required:
  - name
  - status
  - redactionApplied
  properties:
    name:
      type: string
    status:
      "$ref": "#/AdminDiagnosticStatus"
    summary:
      type: string
    redactionApplied:
      type: boolean
    lastCheckedAt:
      type: string
      format: date-time
AdminDiagnosticScoringInput:
  type: object
  additionalProperties: false
  required:
  - name
  - value
  properties:
    name:
      type: string
    value:
      oneOf:
      - type: string
      - type: number
      - type: boolean
AdminDiagnosticReadModelFreshness:
  type: object
  additionalProperties: false
  required:
  - readModel
  - updatedAt
  properties:
    readModel:
      type: string
    updatedAt:
      type: string
      format: date-time
    lagSeconds:
      type: integer
      format: int64
AdminRecommendationDiagnostic:
  type: object
  additionalProperties: false
  required:
  - recommendationId
  - generatedAt
  - scoringInputs
  - reasonCodes
  - eligibilityBlockers
  - policyVersion
  - readModelFreshness
  - cacheStatus
  - correlationId
  properties:
    recommendationId:
      type: string
    generatedAt:
      type: string
      format: date-time
    scoringInputs:
      type: array
      items:
        "$ref": "#/AdminDiagnosticScoringInput"
    reasonCodes:
      type: array
      items:
        type: string
    eligibilityBlockers:
      type: array
      items:
        type: string
    policyVersion:
      type: string
    readModelFreshness:
      "$ref": "#/AdminDiagnosticReadModelFreshness"
    cacheStatus:
      type: string
    correlationId:
      type: string
      description: Redacted or truncated correlation identifier safe for operator display.
    traceId:
      type: string
      description: Redacted or truncated trace identifier safe for operator display.
    auditReference:
      "$ref": "#/AdminAuditReference"
AdminDiagnosticsResponse:
  type: object
  required:
  - churchInstanceId
  - generatedAt
  - components
  properties:
    churchInstanceId:
      type: string
    generatedAt:
      type: string
      format: date-time
    capabilityEnabled:
      type: boolean
      description: Whether recommendation diagnostics are enabled for this instance.
    recommendations:
      type: array
      items:
        "$ref": "#/AdminRecommendationDiagnostic"
    components:
      type: array
      items:
        "$ref": "#/AdminDiagnosticsComponent"
AdminInstanceConfigurationResponse:
  type: object
  required:
  - churchInstanceId
  - displayName
  - defaultLocale
  - timeZone
  - allowedActions
  - concurrency
  properties:
    churchInstanceId:
      type: string
    displayName:
      type: string
    defaultLocale:
      type: string
    timeZone:
      type: string
    diagnosticsEnabled:
      type: boolean
    botChannelsEnabled:
      type: boolean
    allowedActions:
      type: array
      items:
        "$ref": "#/AdminAllowedAction"
    concurrency:
      "$ref": "#/AdminOptimisticConcurrency"
    lastAuditReference:
      "$ref": "#/AdminAuditReference"
UpdateAdminInstanceConfigurationRequest:
  type: object
  additionalProperties: false
  required:
  - displayName
  - defaultLocale
  - timeZone
  - expectedVersion
  - actorId
  - reason
  properties:
    displayName:
      type: string
    defaultLocale:
      type: string
    timeZone:
      type: string
    diagnosticsEnabled:
      type: boolean
    botChannelsEnabled:
      type: boolean
    expectedVersion:
      type: integer
      format: int64
    actorId:
      type: string
    reason:
      type: string
AdminFeatureFlagResponse:
  type: object
  required:
  - flagKey
  - enabled
  - allowedActions
  - concurrency
  properties:
    flagKey:
      type: string
    description:
      type: string
    enabled:
      type: boolean
    allowedActions:
      type: array
      items:
        "$ref": "#/AdminAllowedAction"
    concurrency:
      "$ref": "#/AdminOptimisticConcurrency"
    lastAuditReference:
      "$ref": "#/AdminAuditReference"
AdminFeatureFlagListResponse:
  type: object
  required:
  - churchInstanceId
  - flags
  properties:
    churchInstanceId:
      type: string
    flags:
      type: array
      items:
        "$ref": "#/AdminFeatureFlagResponse"
PreviewAdminFeatureFlagChangeRequest:
  type: object
  additionalProperties: false
  required:
  - enabled
  - expectedVersion
  - actorId
  - reason
  properties:
    enabled:
      type: boolean
    expectedVersion:
      type: integer
      format: int64
    actorId:
      type: string
    reason:
      type: string
AdminFeatureFlagChangePreviewResponse:
  type: object
  required:
  - previewId
  - flagKey
  - requestedEnabled
  - confirmationRequired
  - blockers
  properties:
    previewId:
      type: string
      format: uuid
    flagKey:
      type: string
    requestedEnabled:
      type: boolean
    confirmationRequired:
      type: boolean
    impactSummary:
      type: string
    blockers:
      type: array
      items:
        type: string
ConfirmAdminFeatureFlagChangeRequest:
  type: object
  additionalProperties: false
  required:
  - previewId
  - actorId
  - confirmationText
  properties:
    previewId:
      type: string
      format: uuid
    actorId:
      type: string
    confirmationText:
      type: string
