ImportCandidateStatus:
  type: string
  enum:
  - STAGED
  - DEDUPLICATION_REVIEW
  - READY_TO_MERGE
  - MERGED
  - REJECTED
  - FAILED
AdminImportCandidateQueueItem:
  type: object
  required:
  - candidateId
  - importBatchId
  - rawTitle
  - status
  - updatedAt
  properties:
    candidateId:
      type: string
      format: uuid
    importBatchId:
      type: string
      format: uuid
    rawTitle:
      type: string
    normalizedTitle:
      type: string
      nullable: true
    sourceArtistName:
      type: string
      nullable: true
    status:
      "$ref": "../../cadentia-api.components.yaml#/schemas/ImportCandidateStatus"
    updatedAt:
      type: string
      format: date-time
AdminDuplicateMatch:
  type: object
  required:
  - id
  - candidateSongId
  - matchScore
  - status
  properties:
    id:
      type: string
      format: uuid
    candidateSongId:
      type: string
      format: uuid
    matchScore:
      type: number
      format: double
    matchSignalsJson:
      type: string
      nullable: true
    status:
      type: string
AdminImportCandidateDetailResponse:
  type: object
  required:
  - candidateId
  - importBatchId
  - rawTitle
  - status
  - duplicateMatches
  - reviewHistory
  properties:
    candidateId:
      type: string
      format: uuid
    importBatchId:
      type: string
      format: uuid
    rawTitle:
      type: string
    normalizedTitle:
      type: string
      nullable: true
    sourceArtistName:
      type: string
      nullable: true
    sourcePayloadJson:
      type: string
      nullable: true
    rawSourceReference:
      type: string
      nullable: true
    parserName:
      type: string
      nullable: true
    parserVersion:
      type: string
      nullable: true
    parserConfidence:
      type: string
      nullable: true
    parserWarnings:
      type: array
      items:
        type: string
    status:
      "$ref": "../../cadentia-api.components.yaml#/schemas/ImportCandidateStatus"
    duplicateMatches:
      type: array
      items:
        "$ref": "../../cadentia-api.components.yaml#/schemas/AdminDuplicateMatch"
    reviewHistory:
      type: array
      items:
        "$ref": "../../cadentia-api.components.yaml#/schemas/AdminReviewHistoryItem"
AdminReviewHistoryItem:
  type: object
  required:
  - id
  - decision
  - reviewer
  - reviewedAt
  properties:
    id:
      type: string
      format: uuid
    proposedDuplicateMatchId:
      type: string
      format: uuid
      nullable: true
    decision:
      type: string
    reviewer:
      type: string
    reviewNotes:
      type: string
      nullable: true
    reviewedAt:
      type: string
      format: date-time
ModerationFlagType:
  type: string
  enum:
  - BAD_SOURCE
  - LICENSING_CONCERN
  - INCORRECT_LYRICS
  - METADATA_CONFLICT
  - DOCTRINAL_CONCERN
  - PARSER_ISSUE
ModerationFlagStatus:
  type: string
  enum:
  - OPEN
  - ASSIGNED
  - RESOLVED
  - ESCALATED
ModerationFlagResponse:
  type: object
  required:
  - id
  - importCandidateId
  - type
  - status
  - openedBy
  - excludeFromRecommendation
  - openedAt
  - updatedAt
  properties:
    id:
      type: string
      format: uuid
    importCandidateId:
      type: string
      format: uuid
    type:
      "$ref": "../../cadentia-api.components.yaml#/schemas/ModerationFlagType"
    status:
      "$ref": "../../cadentia-api.components.yaml#/schemas/ModerationFlagStatus"
    openedBy:
      type: string
    assignedTo:
      type: string
      nullable: true
    resolutionNotes:
      type: string
      nullable: true
    excludeFromRecommendation:
      type: boolean
    openedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
RollbackTargetType:
  type: string
  enum:
  - IMPORT_CANDIDATE
  - APPROVAL
  - MODERATION_FLAG
CreateRollbackPreviewRequest:
  type: object
  required:
  - targetType
  - targetId
  - actor
  properties:
    targetType:
      "$ref": "../../cadentia-api.components.yaml#/schemas/RollbackTargetType"
    targetId:
      type: string
      format: uuid
    actor:
      type: string
    importBatchId:
      type: string
      format: uuid
RollbackImpactedRecord:
  type: object
  properties:
    entityType:
      type: string
    entityId:
      type: string
    status:
      type: string
RollbackPreviewResponse:
  type: object
  properties:
    rollbackRequestId:
      type: string
      format: uuid
    targetType:
      "$ref": "../../cadentia-api.components.yaml#/schemas/RollbackTargetType"
    targetId:
      type: string
      format: uuid
    importBatchId:
      type: string
      format: uuid
    eligibilityImpacted:
      type: boolean
    impactedRecords:
      type: array
      items:
        "$ref": "../../cadentia-api.components.yaml#/schemas/RollbackImpactedRecord"
    blockers:
      type: array
      items:
        type: string
ExecuteRollbackRequest:
  type: object
  required:
  - rollbackRequestId
  - actor
  properties:
    rollbackRequestId:
      type: string
      format: uuid
    actor:
      type: string
    reason:
      type: string
RollbackExecutionResponse:
  type: object
  properties:
    rollbackRequestId:
      type: string
      format: uuid
    action:
      type: string
    auditEventId:
      type: string
      format: uuid
AdminAuditHistoryItem:
  type: object
  required:
  - id
  - entityId
  - entityType
  - action
  - actor
  - occurredAt
  properties:
    id:
      type: string
      format: uuid
    entityId:
      type: string
      format: uuid
    entityType:
      type: string
    action:
      type: string
    actor:
      type: string
    occurredAt:
      type: string
      format: date-time
    reason:
      type: string
      nullable: true
    beforeState:
      type: object
      nullable: true
      additionalProperties: true
    afterState:
      type: object
      nullable: true
      additionalProperties: true
OpenModerationFlagRequest:
  type: object
  additionalProperties: false
  required:
  - type
  - openedBy
  - reason
  - excludeFromRecommendation
  properties:
    type:
      "$ref": "../../cadentia-api.components.yaml#/schemas/ModerationFlagType"
    openedBy:
      type: string
    reason:
      type: string
    excludeFromRecommendation:
      type: boolean
AssignModerationFlagRequest:
  type: object
  additionalProperties: false
  required:
  - assignedTo
  - actor
  - reason
  properties:
    assignedTo:
      type: string
    actor:
      type: string
    reason:
      type: string
ResolveModerationFlagRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - resolutionNotes
  properties:
    actor:
      type: string
    resolutionNotes:
      type: string
EscalateModerationFlagRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - reason
  properties:
    actor:
      type: string
    reason:
      type: string
