ImportCandidateStatus:
  type: string
  enum:
  - STAGED
  - DEDUPLICATION_REVIEW
  - READY_TO_MERGE
  - MERGED
  - REJECTED
  - FAILED
ParserSeverity:
  type: string
  enum:
  - NONE
  - INFO
  - WARNING
  - ERROR
ProvenanceStatus:
  type: string
  enum:
  - VERIFIED
  - NEEDS_REVIEW
  - MISSING
  - BLOCKED
DuplicateConfidence:
  type: string
  enum:
  - NONE
  - LOW
  - MEDIUM
  - HIGH
ModerationState:
  type: string
  enum:
  - CLEAR
  - FLAGGED
  - ESCALATED
  - BLOCKED
ReviewPriority:
  type: string
  enum:
  - LOW
  - NORMAL
  - HIGH
  - URGENT
ApprovalReadiness:
  type: string
  enum:
  - BLOCKED
  - NEEDS_REVIEW
  - READY
AllowedImportCandidateAction:
  type: string
  enum:
  - VIEW_DETAIL
  - ASSIGN_REVIEWER
  - OPEN_MODERATION_FLAG
  - REQUEST_PROVENANCE
  - ADD_REVIEW_NOTE
AdminImportCandidateQueueResponse:
  type: object
  required:
  - items
  - page
  - pageSize
  - totalItems
  - totalPages
  - sort
  properties:
    items:
      type: array
      items:
        "$ref": "#/AdminImportCandidateQueueItem"
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
    sort:
      type: string
AdminImportCandidateQueueItem:
  type: object
  required:
  - candidateId
  - importBatchId
  - connectorKey
  - rawTitle
  - status
  - submittedAt
  - updatedAt
  - parserSeverity
  - provenanceStatus
  - duplicateConfidence
  - moderationState
  - reviewPriority
  - approvalReadiness
  - allowedActions
  properties:
    candidateId:
      type: string
      format: uuid
    importBatchId:
      type: string
      format: uuid
    connectorKey:
      type: string
    rawTitle:
      type: string
      description: Title metadata only; never full lyrics or raw connector payload.
    normalizedTitle:
      type: string
      nullable: true
    sourceArtistName:
      type: string
      nullable: true
    status:
      "$ref": "#/ImportCandidateStatus"
    submittedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    assignedReviewerId:
      type: string
      nullable: true
    assignedReviewerName:
      type: string
      nullable: true
    parserSeverity:
      "$ref": "#/ParserSeverity"
    parserConfidence:
      type: number
      format: double
      nullable: true
    parserWarningCount:
      type: integer
      minimum: 0
      default: 0
    provenanceStatus:
      "$ref": "#/ProvenanceStatus"
    provenanceSummary:
      type: string
      nullable: true
    duplicateConfidence:
      "$ref": "#/DuplicateConfidence"
    duplicateMatchCount:
      type: integer
      minimum: 0
      default: 0
    duplicateTopScore:
      type: number
      format: double
      nullable: true
    moderationState:
      "$ref": "#/ModerationState"
    reviewPriority:
      "$ref": "#/ReviewPriority"
    approvalReadiness:
      "$ref": "#/ApprovalReadiness"
    readinessSummary:
      type: string
      nullable: true
    allowedActions:
      type: array
      items:
        "$ref": "#/AllowedImportCandidateAction"
    auditReferenceId:
      type: string
      nullable: true
AdminDuplicateMatch:
  type: object
  required:
  - id
  - candidateSongId
  - matchScore
  - status
  properties:
    id:
      type: string
      format: uuid
    candidateSongId:
      type: string
      format: uuid
    matchScore:
      type: number
      format: double
    matchSignalsJson:
      type: string
      nullable: true
    status:
      type: string
AdminImportCandidateDetailResponse:
  type: object
  required:
  - candidateId
  - importBatchId
  - rawTitle
  - status
  - connectorKey
  - allowedActions
  - version
  - etag
  - eligibilityBlockers
  - duplicateSummary
  - provenanceReferences
  - parserEvidence
  - reviewNotes
  - duplicateMatches
  - reviewHistory
  properties:
    candidateId:
      type: string
      format: uuid
    importBatchId:
      type: string
      format: uuid
    connectorKey:
      type: string
    rawTitle:
      type: string
    normalizedTitle:
      type: string
      nullable: true
    sourceArtistName:
      type: string
      nullable: true
    sourcePayloadRedacted:
      type: boolean
      default: true
    sourcePayloadJson:
      type: string
      nullable: true
      deprecated: true
      description: Legacy field; admin UI must not render unless a separate safe endpoint authorizes it.
    rawSourceReference:
      type: string
      nullable: true
    parserName:
      type: string
      nullable: true
    parserVersion:
      type: string
      nullable: true
    parserConfidence:
      type: string
      nullable: true
    parserWarnings:
      type: array
      items:
        type: string
    status:
      "$ref": "#/ImportCandidateStatus"
    allowedActions:
      type: array
      items:
        "$ref": "#/AllowedImportCandidateAction"
    version:
      type: integer
      format: int64
    etag:
      type: string
    eligibilityBlockers:
      type: array
      items:
        type: string
    duplicateSummary:
      "$ref": "#/AdminDuplicateSummary"
    provenanceReferences:
      type: array
      items:
        "$ref": "#/AdminProvenanceReference"
    parserEvidence:
      "$ref": "#/AdminParserEvidence"
    reviewNotes:
      type: array
      items:
        "$ref": "#/AdminReviewNote"
    relatedAuditReferences:
      type: array
      items:
        type: string
    duplicateMatches:
      type: array
      items:
        "$ref": "#/AdminDuplicateMatch"
    reviewHistory:
      type: array
      items:
        "$ref": "#/AdminReviewHistoryItem"

AdminDuplicateSummary:
  type: object
  properties:
    confidence:
      "$ref": "#/DuplicateConfidence"
    matchCount:
      type: integer
      minimum: 0
    topScore:
      type: number
      format: double
      nullable: true
    summary:
      type: string
      nullable: true
AdminProvenanceReference:
  type: object
  required:
  - label
  - sourceReference
  properties:
    label:
      type: string
    sourceReference:
      type: string
    fingerprint:
      type: string
      nullable: true
    status:
      "$ref": "#/ProvenanceStatus"
AdminParserEvidence:
  type: object
  properties:
    parserName:
      type: string
      nullable: true
    parserVersion:
      type: string
      nullable: true
    confidence:
      type: number
      format: double
      nullable: true
    severity:
      "$ref": "#/ParserSeverity"
    warnings:
      type: array
      items:
        type: string
    evidenceReferences:
      type: array
      items:
        type: string
AdminReviewNote:
  type: object
  required:
  - noteId
  - authorId
  - body
  - createdAt
  properties:
    noteId:
      type: string
      format: uuid
    authorId:
      type: string
    authorDisplayName:
      type: string
      nullable: true
    category:
      type: string
      nullable: true
    body:
      type: string
      maxLength: 2000
    createdAt:
      type: string
      format: date-time
    auditReferenceId:
      type: string
      nullable: true
CreateAdminReviewNoteRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - body
  properties:
    actor:
      type: string
    category:
      type: string
      nullable: true
    body:
      type: string
      minLength: 1
      maxLength: 2000
AdminReviewHistoryItem:
  type: object
  required:
  - id
  - decision
  - reviewer
  - reviewedAt
  properties:
    id:
      type: string
      format: uuid
    proposedDuplicateMatchId:
      type: string
      format: uuid
      nullable: true
    decision:
      type: string
    reviewer:
      type: string
    reviewNotes:
      type: string
      nullable: true
    reviewedAt:
      type: string
      format: date-time
ModerationFlagType:
  type: string
  enum:
  - BAD_SOURCE
  - LICENSING_CONCERN
  - INCORRECT_LYRICS
  - METADATA_CONFLICT
  - DOCTRINAL_CONCERN
  - PARSER_ISSUE
ModerationFlagStatus:
  type: string
  enum:
  - OPEN
  - ASSIGNED
  - RESOLVED
  - ESCALATED
ModerationFlagResponse:
  type: object
  required:
  - id
  - importCandidateId
  - type
  - status
  - openedBy
  - excludeFromRecommendation
  - openedAt
  - updatedAt
  properties:
    id:
      type: string
      format: uuid
    importCandidateId:
      type: string
      format: uuid
    type:
      "$ref": "#/ModerationFlagType"
    status:
      "$ref": "#/ModerationFlagStatus"
    openedBy:
      type: string
    assignedTo:
      type: string
      nullable: true
    resolutionNotes:
      type: string
      nullable: true
    excludeFromRecommendation:
      type: boolean
    openedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
RollbackTargetType:
  type: string
  enum:
  - IMPORT_CANDIDATE
  - APPROVAL
  - MODERATION_FLAG
CreateRollbackPreviewRequest:
  type: object
  required:
  - targetType
  - targetId
  - actor
  properties:
    targetType:
      "$ref": "#/RollbackTargetType"
    targetId:
      type: string
      format: uuid
    actor:
      type: string
    importBatchId:
      type: string
      format: uuid
RollbackImpactedRecord:
  type: object
  properties:
    entityType:
      type: string
    entityId:
      type: string
    status:
      type: string
RollbackPreviewResponse:
  type: object
  properties:
    rollbackRequestId:
      type: string
      format: uuid
    targetType:
      "$ref": "#/RollbackTargetType"
    targetId:
      type: string
      format: uuid
    importBatchId:
      type: string
      format: uuid
    eligibilityImpacted:
      type: boolean
    impactedRecords:
      type: array
      items:
        "$ref": "#/RollbackImpactedRecord"
    blockers:
      type: array
      items:
        type: string
ExecuteRollbackRequest:
  type: object
  required:
  - rollbackRequestId
  - actor
  properties:
    rollbackRequestId:
      type: string
      format: uuid
    actor:
      type: string
    reason:
      type: string
RollbackExecutionResponse:
  type: object
  properties:
    rollbackRequestId:
      type: string
      format: uuid
    action:
      type: string
    auditEventId:
      type: string
      format: uuid
AdminAuditHistoryItem:
  type: object
  required:
  - id
  - entityId
  - entityType
  - action
  - actor
  - occurredAt
  properties:
    id:
      type: string
      format: uuid
    entityId:
      type: string
      format: uuid
    entityType:
      type: string
    action:
      type: string
    actor:
      type: string
    occurredAt:
      type: string
      format: date-time
    reason:
      type: string
      nullable: true
    beforeState:
      type: object
      nullable: true
      additionalProperties: true
    afterState:
      type: object
      nullable: true
      additionalProperties: true
OpenModerationFlagRequest:
  type: object
  additionalProperties: false
  required:
  - type
  - openedBy
  - reason
  - excludeFromRecommendation
  properties:
    type:
      "$ref": "#/ModerationFlagType"
    openedBy:
      type: string
    reason:
      type: string
    excludeFromRecommendation:
      type: boolean
AssignModerationFlagRequest:
  type: object
  additionalProperties: false
  required:
  - assignedTo
  - actor
  - reason
  properties:
    assignedTo:
      type: string
    actor:
      type: string
    reason:
      type: string
ResolveModerationFlagRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - resolutionNotes
  properties:
    actor:
      type: string
    resolutionNotes:
      type: string
EscalateModerationFlagRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - reason
  properties:
    actor:
      type: string
    reason:
      type: string
