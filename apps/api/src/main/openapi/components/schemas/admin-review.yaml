ImportCandidateStatus:
  type: string
  enum:
  - STAGED
  - DEDUPLICATION_REVIEW
  - READY_TO_MERGE
  - MERGED
  - REJECTED
  - FAILED
AdminSongImportMethod:
  type: string
  enum:
  - MANUAL_ENTRY
  - CSV_IMPORT
AdminSongLicenseType:
  type: string
  enum:
  - PUBLIC_DOMAIN
  - CCLI
  - DIRECT_PERMISSION
  - NOT_APPLICABLE
AdminSongResource:
  type: object
  additionalProperties: false
  required:
  - resourceType
  - title
  properties:
    resourceType:
      type: string
      enum:
      - CHORD_CHART
      - LEAD_SHEET
      - SHEET_MUSIC
      - AUDIO_REFERENCE
      - VIDEO_REFERENCE
      - PLANNING_CENTER_RESOURCE
      - OTHER
    title:
      type: string
      minLength: 1
      maxLength: 160
    url:
      type: string
      maxLength: 1000
      nullable: true
    assetId:
      type: string
      format: uuid
      nullable: true
    notes:
      type: string
      maxLength: 1000
      nullable: true
AdminManualSongImportRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - title
  - licenseType
  properties:
    actor:
      type: string
      minLength: 1
      maxLength: 160
    title:
      type: string
      minLength: 1
      maxLength: 240
    author:
      type: string
      maxLength: 240
      nullable: true
    artist:
      type: string
      maxLength: 240
      nullable: true
    ccliNumber:
      type: string
      maxLength: 64
      nullable: true
    copyright:
      type: string
      maxLength: 500
      nullable: true
    publisher:
      type: string
      maxLength: 240
      nullable: true
    language:
      type: string
      maxLength: 32
      nullable: true
    key:
      type: string
      maxLength: 16
      nullable: true
    bpm:
      type: integer
      minimum: 30
      maximum: 260
      nullable: true
    timeSignature:
      type: string
      maxLength: 16
      nullable: true
    energy:
      type: integer
      minimum: 1
      maximum: 5
      nullable: true
    difficulty:
      type: integer
      minimum: 1
      maximum: 5
      nullable: true
    themes:
      type: array
      items:
        type: string
        maxLength: 80
      maxItems: 20
    scriptureReferences:
      type: array
      items:
        type: string
        maxLength: 80
      maxItems: 20
    lyrics:
      type: string
      maxLength: 30000
      nullable: true
      description: Operator-provided lyrics or chord text retained only as staged source evidence until review.
    chordChart:
      type: string
      maxLength: 30000
      nullable: true
    arrangementNotes:
      type: string
      maxLength: 4000
      nullable: true
    sourceReference:
      type: string
      maxLength: 500
      nullable: true
    licenseType:
      "$ref": "#/AdminSongLicenseType"
    licenseEvidence:
      type: string
      maxLength: 1000
      nullable: true
    resources:
      type: array
      items:
        "$ref": "#/AdminSongResource"
      maxItems: 20
AdminCsvSongImportRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - file
  - licenseType
  properties:
    actor:
      type: string
      minLength: 1
      maxLength: 160
    file:
      type: string
      format: binary
      description: UTF-8 CSV file. Header names follow the manual import field names where possible.
    licenseType:
      "$ref": "#/AdminSongLicenseType"
    licenseEvidence:
      type: string
      maxLength: 1000
      nullable: true
AdminSongImportValidationError:
  type: object
  required:
  - rowIdentifier
  - field
  - message
  properties:
    rowIdentifier:
      type: string
    field:
      type: string
    message:
      type: string
AdminSongImportCandidateSummary:
  type: object
  required:
  - candidateId
  - rawTitle
  - status
  properties:
    candidateId:
      type: string
      format: uuid
    rawTitle:
      type: string
    normalizedTitle:
      type: string
      nullable: true
    sourceArtistName:
      type: string
      nullable: true
    status:
      "$ref": "#/ImportCandidateStatus"
AdminSongImportResponse:
  type: object
  required:
  - importBatchId
  - status
  - acceptedCount
  - validationErrorCount
  - candidateIds
  - candidates
  - validationErrors
  properties:
    importBatchId:
      type: string
      format: uuid
    status:
      type: string
      enum:
      - PENDING
      - RUNNING
      - COMPLETED
      - FAILED
      - CANCELLED
    method:
      "$ref": "#/AdminSongImportMethod"
    acceptedCount:
      type: integer
      minimum: 0
    validationErrorCount:
      type: integer
      minimum: 0
    candidateIds:
      type: array
      items:
        type: string
        format: uuid
      description: Deprecated for UI rendering; use candidates for display labels.
    candidates:
      type: array
      items:
        "$ref": "#/AdminSongImportCandidateSummary"
    validationErrors:
      type: array
      items:
        "$ref": "#/AdminSongImportValidationError"
AdminCatalogSongSummary:
  type: object
  required:
  - songId
  - canonicalTitle
  - primaryLanguage
  - songStatus
  - updatedAt
  - arrangementCount
  properties:
    songId:
      type: string
      format: uuid
    canonicalTitle:
      type: string
    normalizedTitle:
      type: string
    primaryLanguage:
      type: string
    originalArtistDisplay:
      type: string
      nullable: true
    composerCredits:
      type: string
      nullable: true
    ccliNumber:
      type: string
      nullable: true
    yearWritten:
      type: integer
      nullable: true
    songStatus:
      type: string
    updatedAt:
      type: string
      format: date-time
    arrangementCount:
      type: integer
      minimum: 0
AdminCatalogSongListResponse:
  type: object
  required:
  - items
  - page
  - pageSize
  - totalItems
  - totalPages
  - sort
  properties:
    items:
      type: array
      items:
        "$ref": "#/AdminCatalogSongSummary"
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
    sort:
      type: string
AdminCatalogSongDetailResponse:
  type: object
  required:
  - song
  - arrangements
  - provenance
  - approvals
  - tags
  properties:
    song:
      "$ref": "#/AdminCatalogSongSummary"
    doctrinalNotes:
      type: string
      nullable: true
    arrangements:
      type: array
      items:
        "$ref": "#/AdminCatalogArrangement"
    provenance:
      type: array
      items:
        "$ref": "#/AdminCatalogProvenanceRecord"
    approvals:
      type: array
      items:
        "$ref": "#/AdminCatalogApprovalRecord"
    tags:
      type: array
      items:
        "$ref": "#/AdminCatalogTag"
AdminCatalogSongUpdateRequest:
  type: object
  additionalProperties: false
  required:
  - canonicalTitle
  - primaryLanguage
  - songStatus
  - actor
  properties:
    actor:
      type: string
      minLength: 1
      maxLength: 160
    canonicalTitle:
      type: string
      minLength: 1
      maxLength: 240
    normalizedTitle:
      type: string
      maxLength: 240
      nullable: true
      description: Optional deterministic title key override. If omitted, the backend derives it from canonicalTitle.
    primaryLanguage:
      type: string
      minLength: 1
      maxLength: 32
    originalArtistDisplay:
      type: string
      maxLength: 240
      nullable: true
    composerCredits:
      type: string
      maxLength: 500
      nullable: true
    ccliNumber:
      type: string
      maxLength: 64
      nullable: true
    yearWritten:
      type: integer
      minimum: 1
      maximum: 9999
      nullable: true
    songStatus:
      type: string
      enum:
      - DRAFT
      - IN_REVIEW
      - APPROVED
      - REJECTED
      - ARCHIVED
    doctrinalNotes:
      type: string
      maxLength: 4000
      nullable: true
    arrangements:
      type: array
      items:
        "$ref": "#/AdminCatalogArrangementUpdateRequest"
      maxItems: 25
    lyricsDocuments:
      type: array
      items:
        "$ref": "#/AdminCatalogLyricsUpdateRequest"
      maxItems: 25
AdminCatalogArrangement:
  type: object
  required:
  - arrangementId
  - songId
  - name
  - normalizedName
  - sourceType
  - language
  - defaultForSong
  - active
  - updatedAt
  - lyricsDocuments
  properties:
    arrangementId:
      type: string
      format: uuid
    songId:
      type: string
      format: uuid
    name:
      type: string
    normalizedName:
      type: string
    sourceType:
      type: string
    language:
      type: string
    musicalKey:
      type: string
      nullable: true
    keyMode:
      type: string
      nullable: true
    tempoBpm:
      type: integer
      nullable: true
    timeSignature:
      type: string
      nullable: true
    durationSeconds:
      type: integer
      nullable: true
    energyLevel:
      type: integer
      nullable: true
    difficultyLevel:
      type: integer
      nullable: true
    defaultForSong:
      type: boolean
    active:
      type: boolean
    updatedAt:
      type: string
      format: date-time
    lyricsDocuments:
      type: array
      items:
        "$ref": "#/AdminCatalogLyricsDocument"
AdminCatalogArrangementUpdateRequest:
  type: object
  additionalProperties: false
  required:
  - name
  - sourceType
  - language
  - defaultForSong
  - active
  properties:
    arrangementId:
      type: string
      format: uuid
      nullable: true
      description: Existing arrangement identifier. Omit to create a new arrangement for this song.
    name:
      type: string
      minLength: 1
      maxLength: 240
    normalizedName:
      type: string
      maxLength: 240
      nullable: true
    sourceType:
      type: string
      enum:
      - ORIGINAL
      - LIVE
      - ACOUSTIC
      - STUDIO
      - TRANSLATION
      - CUSTOM
      - UNKNOWN
    language:
      type: string
      minLength: 1
      maxLength: 32
    musicalKey:
      type: string
      maxLength: 16
      nullable: true
    keyMode:
      type: string
      enum:
      - MAJOR
      - MINOR
      - MODAL
      - UNKNOWN
      nullable: true
    tempoBpm:
      type: integer
      minimum: 30
      maximum: 260
      nullable: true
    timeSignature:
      type: string
      maxLength: 16
      nullable: true
    durationSeconds:
      type: integer
      minimum: 1
      nullable: true
    energyLevel:
      type: integer
      minimum: 1
      maximum: 5
      nullable: true
    difficultyLevel:
      type: integer
      minimum: 1
      maximum: 5
      nullable: true
    defaultForSong:
      type: boolean
    active:
      type: boolean
AdminCatalogLyricsDocument:
  type: object
  required:
  - lyricsDocumentId
  - arrangementId
  - format
  - versionNumber
  - current
  - containsChords
  - containsSections
  - sourceReference
  - createdBy
  - createdAt
  - parseStatus
  properties:
    lyricsDocumentId:
      type: string
      format: uuid
    arrangementId:
      type: string
      format: uuid
    format:
      type: string
    content:
      type: string
      nullable: true
      description: Current catalog lyrics/chord content for review users. Clients must not use this field for recommendation selection.
    contentHash:
      type: string
    versionNumber:
      type: integer
    current:
      type: boolean
    containsChords:
      type: boolean
    containsSections:
      type: boolean
    sourceReference:
      type: string
    createdBy:
      type: string
    createdAt:
      type: string
      format: date-time
    parseStatus:
      type: string
    parseError:
      type: string
      nullable: true
AdminCatalogLyricsUpdateRequest:
  type: object
  additionalProperties: false
  required:
  - format
  - content
  - sourceReference
  properties:
    lyricsDocumentId:
      type: string
      format: uuid
      nullable: true
      description: Existing lyrics document identifier. Omit to create a new lyrics document for the specified arrangement.
    arrangementId:
      type: string
      format: uuid
      nullable: true
      description: Required when lyricsDocumentId is omitted. Identifies which arrangement the new lyrics document belongs to.
    format:
      type: string
      enum:
      - plain_text
      - chordpro
      - onsong
      - markdown
    content:
      type: string
      minLength: 1
      maxLength: 30000
    containsChords:
      type: boolean
      default: false
    containsSections:
      type: boolean
      default: false
    sourceReference:
      type: string
      minLength: 1
      maxLength: 500
AdminCatalogProvenanceRecord:
  type: object
  required:
  - provenanceId
  - sourceSystem
  - sourceLabel
  - licenseType
  - importMethod
  - capturedAt
  properties:
    provenanceId:
      type: string
      format: uuid
    arrangementId:
      type: string
      format: uuid
      nullable: true
    lyricsDocumentId:
      type: string
      format: uuid
      nullable: true
    sourceSystem:
      type: string
    sourceUri:
      type: string
      nullable: true
    sourceLabel:
      type: string
    licenseType:
      type: string
    licenseNotes:
      type: string
      nullable: true
    importMethod:
      type: string
    confidenceScore:
      type: number
      nullable: true
    capturedAt:
      type: string
      format: date-time
AdminCatalogApprovalRecord:
  type: object
  required:
  - approvalId
  - approvalType
  - status
  - createdAt
  properties:
    approvalId:
      type: string
      format: uuid
    arrangementId:
      type: string
      format: uuid
      nullable: true
    lyricsDocumentId:
      type: string
      format: uuid
      nullable: true
    approvalType:
      type: string
    status:
      type: string
    reviewer:
      type: string
      nullable: true
    reviewNotes:
      type: string
      nullable: true
    reviewedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
AdminCatalogTag:
  type: object
  required:
  - tagId
  - tagType
  - name
  - slug
  - active
  properties:
    tagId:
      type: string
      format: uuid
    tagType:
      type: string
    name:
      type: string
    slug:
      type: string
    description:
      type: string
      nullable: true
    active:
      type: boolean
AdminCatalogTagType:
  type: string
  enum:
  - THEME
  - MOOD
  - OCCASION
  - SCRIPTURE
  - SEASON
  - MUSICAL_STYLE
  - AUDIENCE
AdminCatalogSongTagAssignRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - tagType
  - name
  properties:
    actor:
      type: string
      minLength: 1
      maxLength: 200
      description: Reviewer or administrator identity recorded in the privileged
        action audit trail.
    tagType:
      "$ref": "#/AdminCatalogTagType"
    name:
      type: string
      minLength: 1
      maxLength: 200
      description: Curated tag display name. Resolved against the controlled
        taxonomy by type and slugified name; a new active tag is created when no
        match exists.
      example: Philippians 4:10-20
    description:
      type: string
      nullable: true
      description: Optional taxonomy description used only when a new tag is created.
ParserSeverity:
  type: string
  enum:
  - NONE
  - INFO
  - WARNING
  - ERROR
ProvenanceStatus:
  type: string
  enum:
  - VERIFIED
  - NEEDS_REVIEW
  - MISSING
  - BLOCKED
DuplicateConfidence:
  type: string
  enum:
  - NONE
  - LOW
  - MEDIUM
  - HIGH
ModerationState:
  type: string
  enum:
  - CLEAR
  - FLAGGED
  - ESCALATED
  - BLOCKED
ReviewPriority:
  type: string
  enum:
  - LOW
  - NORMAL
  - HIGH
  - URGENT
ApprovalReadiness:
  type: string
  enum:
  - BLOCKED
  - NEEDS_REVIEW
  - READY
AllowedImportCandidateAction:
  type: string
  enum:
  - VIEW_DETAIL
  - ASSIGN_REVIEWER
  - OPEN_MODERATION_FLAG
  - REQUEST_PROVENANCE
  - ADD_REVIEW_NOTE
  - MERGE_DECISION_CREATE_NEW
  - MERGE_DECISION_MERGE_EXISTING
  - MERGE_DECISION_REJECT_DUPLICATE
  - MERGE_DECISION_REJECT_NOT_PERMITTED
  - MERGE_DECISION_DEFER
  - COMMIT_MERGE
  - SUBMIT_APPROVAL_ACTION
  - REVERSE_APPROVAL
AdminImportCandidateQueueResponse:
  type: object
  required:
  - items
  - page
  - pageSize
  - totalItems
  - totalPages
  - sort
  properties:
    items:
      type: array
      items:
        "$ref": "#/AdminImportCandidateQueueItem"
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
    sort:
      type: string
AdminImportCandidateQueueItem:
  type: object
  required:
  - candidateId
  - importBatchId
  - connectorKey
  - rawTitle
  - status
  - submittedAt
  - updatedAt
  - parserSeverity
  - provenanceStatus
  - duplicateConfidence
  - moderationState
  - reviewPriority
  - approvalReadiness
  - allowedActions
  properties:
    candidateId:
      type: string
      format: uuid
    importBatchId:
      type: string
      format: uuid
    connectorKey:
      type: string
    rawTitle:
      type: string
      description: Title metadata only; never full lyrics or raw connector payload.
    normalizedTitle:
      type: string
      nullable: true
    sourceArtistName:
      type: string
      nullable: true
    status:
      "$ref": "#/ImportCandidateStatus"
    submittedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    assignedReviewerId:
      type: string
      nullable: true
    assignedReviewerName:
      type: string
      nullable: true
    parserSeverity:
      "$ref": "#/ParserSeverity"
    parserConfidence:
      type: number
      format: double
      nullable: true
    parserWarningCount:
      type: integer
      minimum: 0
      default: 0
    provenanceStatus:
      "$ref": "#/ProvenanceStatus"
    provenanceSummary:
      type: string
      nullable: true
    duplicateConfidence:
      "$ref": "#/DuplicateConfidence"
    duplicateMatchCount:
      type: integer
      minimum: 0
      default: 0
    duplicateTopScore:
      type: number
      format: double
      nullable: true
    moderationState:
      "$ref": "#/ModerationState"
    reviewPriority:
      "$ref": "#/ReviewPriority"
    approvalReadiness:
      "$ref": "#/ApprovalReadiness"
    readinessSummary:
      type: string
      nullable: true
    allowedActions:
      type: array
      items:
        "$ref": "#/AllowedImportCandidateAction"
    auditReferenceId:
      type: string
      nullable: true
AdminDuplicateMatch:
  type: object
  required:
  - id
  - candidateSongId
  - matchScore
  - status
  properties:
    id:
      type: string
      format: uuid
    candidateSongId:
      type: string
      format: uuid
    matchScore:
      type: number
      format: double
    matchSignalsJson:
      type: string
      nullable: true
    status:
      type: string
AdminImportCandidateDetailResponse:
  type: object
  required:
  - candidateId
  - importBatchId
  - rawTitle
  - status
  - connectorKey
  - allowedActions
  - version
  - etag
  - eligibilityBlockers
  - duplicateSummary
  - provenanceReferences
  - parserEvidence
  - reviewNotes
  - duplicateMatches
  - reviewHistory
  properties:
    candidateId:
      type: string
      format: uuid
    importBatchId:
      type: string
      format: uuid
    connectorKey:
      type: string
    rawTitle:
      type: string
    normalizedTitle:
      type: string
      nullable: true
    sourceArtistName:
      type: string
      nullable: true
    sourcePayloadRedacted:
      type: boolean
      default: true
    sourcePayloadJson:
      type: string
      nullable: true
      deprecated: true
      description: Legacy field; admin UI must not render unless a separate safe endpoint authorizes it.
    rawSourceReference:
      type: string
      nullable: true
    parserName:
      type: string
      nullable: true
    parserVersion:
      type: string
      nullable: true
    parserConfidence:
      type: string
      nullable: true
    parserWarnings:
      type: array
      items:
        type: string
    status:
      "$ref": "#/ImportCandidateStatus"
    allowedActions:
      type: array
      items:
        "$ref": "#/AllowedImportCandidateAction"
    version:
      type: integer
      format: int64
    etag:
      type: string
    eligibilityBlockers:
      type: array
      items:
        type: string
    duplicateSummary:
      "$ref": "#/AdminDuplicateSummary"
    provenanceReferences:
      type: array
      items:
        "$ref": "#/AdminProvenanceReference"
    parserEvidence:
      "$ref": "#/AdminParserEvidence"
    reviewNotes:
      type: array
      items:
        "$ref": "#/AdminReviewNote"
    relatedAuditReferences:
      type: array
      items:
        type: string
    duplicateMatches:
      type: array
      items:
        "$ref": "#/AdminDuplicateMatch"
    reviewHistory:
      type: array
      items:
        "$ref": "#/AdminReviewHistoryItem"
    duplicateComparison:
      "$ref": "#/AdminDuplicateComparison"
    approvalState:
      "$ref": "#/AdminApprovalState"
    moderationFlags:
      type: array
      items:
        "$ref": "#/ModerationFlagResponse"

AdminDuplicateSummary:
  type: object
  properties:
    confidence:
      "$ref": "#/DuplicateConfidence"
    matchCount:
      type: integer
      minimum: 0
    topScore:
      type: number
      format: double
      nullable: true
    summary:
      type: string
      nullable: true
AdminProvenanceReference:
  type: object
  required:
  - label
  - sourceReference
  properties:
    label:
      type: string
    sourceReference:
      type: string
    fingerprint:
      type: string
      nullable: true
    status:
      "$ref": "#/ProvenanceStatus"
AdminParserEvidence:
  type: object
  properties:
    parserName:
      type: string
      nullable: true
    parserVersion:
      type: string
      nullable: true
    confidence:
      type: number
      format: double
      nullable: true
    severity:
      "$ref": "#/ParserSeverity"
    warnings:
      type: array
      items:
        type: string
    evidenceReferences:
      type: array
      items:
        type: string
AdminReviewNote:
  type: object
  required:
  - noteId
  - authorId
  - body
  - createdAt
  properties:
    noteId:
      type: string
      format: uuid
    authorId:
      type: string
    authorDisplayName:
      type: string
      nullable: true
    category:
      type: string
      nullable: true
    body:
      type: string
      maxLength: 2000
    createdAt:
      type: string
      format: date-time
    auditReferenceId:
      type: string
      nullable: true
CreateAdminReviewNoteRequest:
  type: object
  additionalProperties: false
  required:
  - actor
  - body
  properties:
    actor:
      type: string
    category:
      type: string
      nullable: true
    body:
      type: string
      minLength: 1
      maxLength: 2000
AdminReviewHistoryItem:
  type: object
  required:
  - id
  - decision
  - reviewer
  - reviewedAt
  properties:
    id:
      type: string
      format: uuid
    proposedDuplicateMatchId:
      type: string
      format: uuid
      nullable: true
    decision:
      type: string
    reviewer:
      type: string
    reviewNotes:
      type: string
      nullable: true
