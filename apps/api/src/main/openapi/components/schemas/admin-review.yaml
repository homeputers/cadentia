    processedCount:
      type: integer
      minimum: 0
    successCount:
      type: integer
      minimum: 0
    failureCount:
      type: integer
      minimum: 0
    results:
      type: array
      items:
        "$ref": "#/BulkActionResult"
    auditReferenceId:
      type: string
      nullable: true
