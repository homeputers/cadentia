  - WORSHIP_LEADER
  - VOCALIST
  - INSTRUMENTALIST
  - MUSIC_DIRECTOR
  - TECH
TeamInstrumentCode:
  type: string
  enum:
  - ACOUSTIC_GUITAR
  - ELECTRIC_GUITAR
  - PIANO
  - KEYS
  - BASS
  - DRUMS
  - PERCUSSION
  - BRASS
  - WINDS
  - OTHER
TeamVocalPartCode:
  type: string
