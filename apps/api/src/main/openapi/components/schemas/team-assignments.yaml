TeamMusicianResponse:
  type: object
  description: Privacy-aware musician record. Contact, vocal-range, and serving-preference
    fields are null unless the caller role is permitted to read them.
  required:
  - musicianId
  - displayName
  - active
  properties:
    musicianId:
      type: string
      format: uuid
    displayName:
      type: string
    accountPrincipal:
      type: string
      nullable: true
    email:
      type: string
      nullable: true
    phone:
      type: string
      nullable: true
    primaryVocalRangeCode:
      "$ref": "#/TeamVocalRangeCode"
      nullable: true
    comfortableLowMidiNote:
      type: integer
      nullable: true
    comfortableHighMidiNote:
      type: integer
      nullable: true
    servingPreferenceCode:
      "$ref": "#/TeamServingPreferenceCode"
      nullable: true
    active:
      type: boolean
CreateTeamMusicianRequest:
  type: object
  additionalProperties: false
  required:
