TeamMusicianRoleCode:
  type: string
  enum:
  - WORSHIP_LEADER
  - VOCALIST
  - INSTRUMENTALIST
  - MUSIC_DIRECTOR
  - TECH
TeamInstrumentCode:
  type: string
  enum:
  - ACOUSTIC_GUITAR
  - ELECTRIC_GUITAR
  - PIANO
  - KEYS
  - BASS
  - DRUMS
  - PERCUSSION
  - BRASS
  - WINDS
  - OTHER
TeamVocalPartCode:
  type: string
  enum:
  - LEAD
  - ALTO
  - TENOR
  - BARITONE
  - SOPRANO
  - BACKGROUND
TeamAssignmentStatusCode:
  type: string
  enum:
  - REQUESTED
  - TENTATIVE
  - ACCEPTED
  - DECLINED
  - UNAVAILABLE
  - SUBSTITUTE
TeamAssignmentType:
  type: string
  enum:
  - SERVICE
  - REHEARSAL
  - SONG_OVERRIDE
TeamServiceAssignmentRequest:
  type: object
  additionalProperties: false
  required:
  - musicianId
  - roleCode
  - statusCode
  properties:
    musicianId:
      type: string
      format: uuid
    roleCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamMusicianRoleCode"
    instrumentCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamInstrumentCode"
    vocalPartCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamVocalPartCode"
    statusCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamAssignmentStatusCode"
    assignmentOrder:
      type: integer
      minimum: 0
      nullable: true
    overrideUnavailable:
      type: boolean
      default: false
    reasonCode:
      type: string
      nullable: true
    reference:
      type: string
      nullable: true
TeamServiceAssignmentResponse:
  type: object
  required:
  - assignmentId
  - servicePlanId
  - musicianId
  - roleCode
  - statusCode
  properties:
    assignmentId:
      type: string
      format: uuid
    servicePlanId:
      type: string
      format: uuid
    musicianId:
      type: string
      format: uuid
    roleCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamMusicianRoleCode"
    instrumentCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamInstrumentCode"
    vocalPartCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamVocalPartCode"
    statusCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamAssignmentStatusCode"
    assignmentOrder:
      type: integer
      minimum: 0
      nullable: true
    substituteForAssignmentId:
      type: string
      format: uuid
      nullable: true
TeamRehearsalAssignmentRequest:
  type: object
  additionalProperties: false
  required:
  - servicePlanId
  - musicianId
  - roleCode
  - statusCode
  properties:
    servicePlanId:
      type: string
      format: uuid
    serviceAssignmentId:
      type: string
      format: uuid
      nullable: true
    musicianId:
      type: string
      format: uuid
    roleCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamMusicianRoleCode"
    instrumentCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamInstrumentCode"
    vocalPartCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamVocalPartCode"
    statusCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamAssignmentStatusCode"
    substituteForAssignmentId:
      type: string
      format: uuid
      nullable: true
    overrideUnavailable:
      type: boolean
      default: false
    reasonCode:
      type: string
      nullable: true
    reference:
      type: string
      nullable: true
TeamRehearsalAssignmentResponse:
  type: object
  required:
  - assignmentId
  - rehearsalEventId
  - servicePlanId
  - musicianId
  - roleCode
  - statusCode
  properties:
    assignmentId:
      type: string
      format: uuid
    rehearsalEventId:
      type: string
      format: uuid
    servicePlanId:
      type: string
      format: uuid
    musicianId:
      type: string
      format: uuid
    roleCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamMusicianRoleCode"
    instrumentCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamInstrumentCode"
    vocalPartCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamVocalPartCode"
    statusCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamAssignmentStatusCode"
    serviceAssignmentId:
      type: string
      format: uuid
      nullable: true
    substituteForAssignmentId:
      type: string
      format: uuid
      nullable: true
