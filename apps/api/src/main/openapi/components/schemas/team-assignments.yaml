  - REHEARSAL
  - SONG_OVERRIDE
TeamServiceAssignmentRequest:
  type: object
  additionalProperties: false
  required:
  - musicianId
  - roleCode
  - statusCode
  properties:
    musicianId:
      type: string
      format: uuid
    roleCode:
      "$ref": "#/TeamMusicianRoleCode"
    instrumentCode:
      "$ref": "#/TeamInstrumentCode"
    vocalPartCode:
      "$ref": "#/TeamVocalPartCode"
    statusCode:
      "$ref": "#/TeamAssignmentStatusCode"
    assignmentOrder:
      type: integer
      minimum: 0
      nullable: true
    overrideUnavailable:
      type: boolean
      default: false
    reasonCode:
      type: string
      nullable: true
    reference:
      type: string
      nullable: true
TeamServiceAssignmentResponse:
  type: object
  required:
