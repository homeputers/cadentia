TeamSubstituteAssignmentRequest:
  type: object
  additionalProperties: false
  required:
  - substituteMusicianId
  properties:
    substituteMusicianId:
      type: string
      format: uuid
    statusCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamAssignmentStatusCode"
    overrideUnavailable:
      type: boolean
      default: false
    reasonCode:
      type: string
      nullable: true
    reference:
      type: string
      nullable: true
TeamReorderAssignmentsRequest:
  type: object
  additionalProperties: false
  required:
  - orderedAssignmentIds
  properties:
    orderedAssignmentIds:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
    reasonCode:
      type: string
      nullable: true
    reference:
      type: string
      nullable: true
TeamServiceRosterResponse:
  type: object
  required:
  - servicePlanId
  - assignments
  - staffingGaps
  - availabilityConflicts
  properties:
    readinessSummary:
      "$ref": "../../cadentia-api.components.yaml#/schemas/ReadinessSummary"
      nullable: true
    servicePlanId:
      type: string
      format: uuid
    assignments:
      type: array
      items:
        "$ref": "../../cadentia-api.components.yaml#/schemas/TeamServiceAssignmentResponse"
    staffingGaps:
      type: array
      items:
        type: string
    availabilityConflicts:
      type: array
      items:
        type: string
TeamAssignmentHistoryResponse:
  type: object
  required:
  - historyId
  - assignmentType
  - assignmentId
  - servicePlanId
  - changeAction
  - changedBy
  - reasonCode
  - changedAt
  properties:
    historyId:
      type: string
      format: uuid
    assignmentType:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamAssignmentType"
    assignmentId:
      type: string
      format: uuid
    servicePlanId:
      type: string
      format: uuid
    rehearsalEventId:
      type: string
      format: uuid
      nullable: true
    musicianId:
      type: string
      format: uuid
      nullable: true
    roleCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamMusicianRoleCode"
    instrumentCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamInstrumentCode"
    vocalPartCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamVocalPartCode"
    statusCode:
      "$ref": "../../cadentia-api.components.yaml#/schemas/TeamAssignmentStatusCode"
    assignmentOrder:
      type: integer
      nullable: true
    substituteForAssignmentId:
      type: string
      format: uuid
      nullable: true
    serviceAssignmentId:
      type: string
      format: uuid
      nullable: true
    changeAction:
      type: string
    changedBy:
      type: string
    reasonCode:
      type: string
    reference:
      type: string
      nullable: true
    changedAt:
      type: string
      format: date-time
