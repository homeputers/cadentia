InvalidWorkflowPayload:
  description: Rehearsal workflow payload failed validation or used an unsupported
    status code.
  content:
    application/json:
      schema:
        "$ref": "../schemas/rehearsal-workflow.yaml#/WorkflowProblemResponse"
BlockedWorkflowTransition:
  description: Requested readiness or workflow transition is not allowed by the state
    machine.
  content:
    application/json:
      schema:
        "$ref": "../schemas/rehearsal-workflow.yaml#/WorkflowProblemResponse"
WorkflowVersionConflict:
  description: Request expected version did not match the current workflow resource
    version.
  content:
    application/json:
      schema:
        "$ref": "../schemas/rehearsal-workflow.yaml#/WorkflowProblemResponse"
Unauthorized:
  description: Authentication is required; response does not reveal resource existence.
Forbidden:
  description: Actor lacks required capability or church-instance access; response does not reveal resource existence.
Conflict:
  description: Optimistic concurrency check failed or preview token is stale.
ValidationError:
  description: Request validation failed.
