          - arrangement
          - transition
          - set
          - candidate
          - policy
          - catalog
      id:
        type: string
        minLength: 1
        maxLength: 120
      itemId:
        type: string
        maxLength: 120
      songId:
        type: string
        maxLength: 120
      arrangementId:
        type: string
        maxLength: 120
      sourceItemId:
        type: string
        maxLength: 120
      targetItemId:
        type: string
        maxLength: 120
      sourceArrangementId:
        type: string
        maxLength: 120
      targetArrangementId:
        type: string
        maxLength: 120
  RecommendationExplanationEvidence:
    type: object
