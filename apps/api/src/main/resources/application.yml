spring:
  application:
    name: cadentia-api
  datasource:
    url: ${CADENTIA_DB_URL:jdbc:postgresql://localhost:5432/cadentia}
    username: ${CADENTIA_DB_USERNAME:cadentia}
    password: ${CADENTIA_DB_PASSWORD:cadentia}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

cadentia:
  conversation:
    session:
      inactivity-timeout: ${CADENTIA_CONVERSATION_INACTIVITY_TIMEOUT:PT30M}
      absolute-lifetime: ${CADENTIA_CONVERSATION_ABSOLUTE_LIFETIME:PT4H}
