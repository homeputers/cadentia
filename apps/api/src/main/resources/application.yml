spring:
  application:
    name: cadentia-api
  datasource:
    url: ${CADENTIA_DB_URL:jdbc:postgresql://localhost:5432/cadentia}
    username: ${CADENTIA_DB_USERNAME:cadentia}
    password: ${CADENTIA_DB_PASSWORD:cadentia}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

cadentia:
  conversation:
    session:
      inactivity-timeout: ${CADENTIA_CONVERSATION_INACTIVITY_TIMEOUT:PT30M}
      absolute-lifetime: ${CADENTIA_CONVERSATION_ABSOLUTE_LIFETIME:PT4H}
  application:
    version: ${CADENTIA_APPLICATION_VERSION:0.1.0}
  church-config:
    path: ${CADENTIA_CHURCH_CONFIG_PATH:}

  instance:
    id: ${CADENTIA_INSTANCE_ID:local-development}
  auth:
    provider: ${CADENTIA_AUTH_PROVIDER:local}
  local-admin:
    username: ${CADENTIA_LOCAL_ADMIN_USERNAME:user}
    password: ${CADENTIA_LOCAL_ADMIN_PASSWORD:cadentia}
  telegram:
    outbound:
      bot-token-ref: ${CADENTIA_TELEGRAM_OUTBOUND_BOT_TOKEN_REF:${CADENTIA_TELEGRAM_BOT_TOKEN_REF:env:CADENTIA_TELEGRAM_BOT_TOKEN}}
      bot-api-base-url: ${CADENTIA_TELEGRAM_BOT_API_BASE_URL:https://api.telegram.org}
    webhook:
      bot-token-ref: ${CADENTIA_TELEGRAM_BOT_TOKEN_REF:env:CADENTIA_TELEGRAM_BOT_TOKEN}
      secret-token-ref: ${CADENTIA_TELEGRAM_WEBHOOK_SECRET_REF:env:CADENTIA_TELEGRAM_WEBHOOK_SECRET}
      previous-secret-token-ref: ${CADENTIA_TELEGRAM_PREVIOUS_WEBHOOK_SECRET_REF:}
      max-update-age: ${CADENTIA_TELEGRAM_WEBHOOK_MAX_UPDATE_AGE:PT24H}
      max-payload-bytes: ${CADENTIA_TELEGRAM_WEBHOOK_MAX_PAYLOAD_BYTES:262144}
  asset-storage:
    provider: ${CADENTIA_ASSET_STORAGE_PROVIDER:local}
    bucket: ${CADENTIA_ASSET_STORAGE_BUCKET:cadentia-local-assets}
    namespace: ${CADENTIA_ASSET_STORAGE_NAMESPACE:local-development}
    encryption-key-ref: ${CADENTIA_ASSET_STORAGE_ENCRYPTION_KEY_REF:env:CADENTIA_LOCAL_ASSET_KEY_REF}
    region: ${CADENTIA_ASSET_STORAGE_REGION:us-east-1}
    endpoint: ${CADENTIA_ASSET_STORAGE_ENDPOINT:}
    path-style-access-enabled: ${CADENTIA_ASSET_STORAGE_PATH_STYLE_ACCESS_ENABLED:false}
    local-root: ${CADENTIA_ASSET_STORAGE_LOCAL_ROOT:.cadentia/asset-storage}
    signed-upload-url-ttl: ${CADENTIA_ASSET_STORAGE_SIGNED_UPLOAD_URL_TTL:PT15M}
    signed-download-url-ttl: ${CADENTIA_ASSET_STORAGE_SIGNED_DOWNLOAD_URL_TTL:PT10M}
    maximum-signed-url-ttl: ${CADENTIA_ASSET_STORAGE_MAXIMUM_SIGNED_URL_TTL:PT1H}
    pending-upload-ttl: ${CADENTIA_ASSET_STORAGE_PENDING_UPLOAD_TTL:PT2H}
    maximum-object-size-bytes: ${CADENTIA_ASSET_STORAGE_MAXIMUM_OBJECT_SIZE_BYTES:262144000}
    processing-prefix: ${CADENTIA_ASSET_STORAGE_PROCESSING_PREFIX:processing}
    quarantine-prefix: ${CADENTIA_ASSET_STORAGE_QUARANTINE_PREFIX:quarantine}
    available-prefix: ${CADENTIA_ASSET_STORAGE_AVAILABLE_PREFIX:assets}
    allowed-mime-types:
      PDF:
        - application/pdf
      CHORD_CHART:
        - application/pdf
        - text/plain
        - text/markdown
      STEM:
        - audio/mpeg
        - audio/wav
        - audio/x-wav
        - audio/flac
      BACKING_TRACK:
        - audio/mpeg
        - audio/wav
        - audio/x-wav
        - audio/flac
      CLICK_TRACK:
        - audio/mpeg
        - audio/wav
        - audio/x-wav
        - audio/flac
      MIDI_CUE:
        - audio/midi
        - audio/x-midi
      REHEARSAL_RECORDING:
        - audio/mpeg
        - audio/wav
        - audio/x-wav
        - video/mp4
      PREVIEW:
        - image/png
        - image/jpeg
        - audio/mpeg
        - application/pdf
      LOCAL_EXTENSION:
        - application/octet-stream
  cache:
    namespace: ${CADENTIA_CACHE_NAMESPACE:cadentia:local:development}
    url-ref: ${CADENTIA_CACHE_URL_REF:env:CADENTIA_LOCAL_CACHE_URL}
  events:
    namespace: ${CADENTIA_EVENT_NAMESPACE:local.development}
    streams: ${CADENTIA_EVENT_STREAMS:local.development.audit-events,local.development.catalog-import,local.development.recommendation-events}
  provisioning:
    manifest: ${CADENTIA_PROVISIONING_MANIFEST:}
  rehearsal:
    retention:
      completed-sessions-retain-days: ${CADENTIA_REHEARSAL_COMPLETED_SESSIONS_RETAIN_DAYS:400}
      notes-retain-days: ${CADENTIA_REHEARSAL_NOTES_RETAIN_DAYS:180}
      issues-retain-days: ${CADENTIA_REHEARSAL_ISSUES_RETAIN_DAYS:400}
      overrides-retain-days: ${CADENTIA_REHEARSAL_OVERRIDES_RETAIN_DAYS:400}
      audit-retain-days: ${CADENTIA_REHEARSAL_AUDIT_RETAIN_DAYS:2555}
      min-completed-sessions-retain-days: ${CADENTIA_REHEARSAL_MIN_COMPLETED_SESSIONS_RETAIN_DAYS:90}
      min-notes-retain-days: ${CADENTIA_REHEARSAL_MIN_NOTES_RETAIN_DAYS:30}
      min-issues-retain-days: ${CADENTIA_REHEARSAL_MIN_ISSUES_RETAIN_DAYS:180}
      min-overrides-retain-days: ${CADENTIA_REHEARSAL_MIN_OVERRIDES_RETAIN_DAYS:180}
      min-audit-retain-days: ${CADENTIA_REHEARSAL_MIN_AUDIT_RETAIN_DAYS:2555}
