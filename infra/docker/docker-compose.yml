services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cadentia
      POSTGRES_USER: cadentia
      POSTGRES_PASSWORD: cadentia
    ports:
      - "5432:5432"
    volumes:
      - cadentia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadentia -d cadentia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cadentia-postgres:
