name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      typescript: ${{ steps.filter.outputs.typescript }}
      docs: ${{ steps.filter.outputs.docs }}
      admin_web: ${{ steps.filter.outputs.admin_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect component changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'pom.xml'
              - '.github/workflows/build.yml'
            typescript:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/build.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/build.yml'
              - 'scripts/check-adr-governance.mjs'
              - 'package.json'
            admin_web:
              - 'apps/admin-web/**'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test backend
        run: mvn package

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build


  admin_web:
    name: Admin Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin_web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck admin web
        run: npm run typecheck -w @cadentia/admin-web
      - name: Test admin web
        run: npm run test -w @cadentia/admin-web
      - name: Build admin web
        run: npm run build -w @cadentia/admin-web
      - name: Smoke admin web artifact
        run: npm run smoke -w @cadentia/admin-web

  adr_governance:
    name: ADR Governance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce ADR intent-contract governance
        run: npm run check:adr-governance
